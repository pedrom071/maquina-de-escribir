<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Editor, revisor y biblia para proyectos de escritura. Revisión sin IA incluida; con tu propia clave, revisión de coherencia con IA.">
<meta name="theme-color" content="#E6DECD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0C0B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Máquina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Máquina de escribir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: un escritorio de trabajo. Barra fina arriba, índice del proyecto a la izquierda, la hoja al centro y las notas del corrector en el margen derecho, como un pliego corregido a mano. Identidad tomada del sitio "Escritorio" de Pedro: papel, tinta y latón. */
:root{
  --bg:#E6DECD; --sheet:#FBF7EF; --raised:#F3ECDF; --sunk:#DED4C1;
  --ink:#2A221B; --soft:#6B5E4E; --faint:#968873; --line:rgba(42,34,27,.13); --line2:rgba(42,34,27,.26);
  --accent:#8A5C16; --accent-ink:#FFF9EE; --accent-soft:rgba(138,92,22,.12);
  --rep-bg:#F2DD9C; --rep-fg:#835500;
  --dud-bg:#F1CDD3; --dud-fg:#A12541;
  --coh-bg:#CCD9F3; --coh-fg:#2D53A3;
  --bien-bg:#CBE6D2; --bien-fg:#22704A;
  --ort-bg:#F5CFC6; --ort-fg:#BC3328;
  --rec-bg:#DFD3F1; --rec-fg:#6541AC;
  --pend-bg:#E2DACD; --pend-fg:#6B5E4E;
  --eco:#B9770F; --find:rgba(227,178,98,.55); --find-act:#E3B262;
  --ok:#22704A; --warn:#A35F00; --bad:#B3261E; --toast-act:#E3B262; --sel:rgba(138,92,22,.22);
  --shadow:0 1px 2px rgba(42,34,27,.07),0 10px 30px rgba(42,34,27,.08);
  --shadow-pop:0 12px 40px rgba(42,34,27,.22),0 2px 6px rgba(42,34,27,.12);
  --f-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --f-text:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --top-h:52px; --status-h:30px;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0C0B; --sheet:#171411; --raised:#1F1B17; --sunk:#0A0908;
    --ink:#EEE6D8; --soft:#B5A893; --faint:#857965; --line:rgba(238,230,216,.12); --line2:rgba(238,230,216,.24);
    --accent:#E3B262; --accent-ink:#1B1408; --accent-soft:rgba(227,178,98,.14);
    --rep-bg:rgba(227,178,98,.26); --rep-fg:#F0C77A;
    --dud-bg:rgba(236,104,132,.24); --dud-fg:#F59AAE;
    --coh-bg:rgba(120,160,240,.25); --coh-fg:#9DB4FF;
    --bien-bg:rgba(111,217,191,.20); --bien-fg:#6FD9BF;
    --ort-bg:rgba(255,128,110,.24); --ort-fg:#FF8D7E;
    --rec-bg:rgba(170,140,240,.26); --rec-fg:#C3ADF5;
    --pend-bg:rgba(181,168,147,.20); --pend-fg:#B5A893;
    --eco:#E3B262; --find:rgba(227,178,98,.33); --find-act:rgba(227,178,98,.7);
    --ok:#93E39F; --warn:#F0C77A; --bad:#FF8D7E; --toast-act:#8A5C16; --sel:rgba(227,178,98,.38);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --shadow-pop:0 14px 44px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0C0B; --sheet:#171411; --raised:#1F1B17; --sunk:#0A0908;
  --ink:#EEE6D8; --soft:#B5A893; --faint:#857965; --line:rgba(238,230,216,.12); --line2:rgba(238,230,216,.24);
  --accent:#E3B262; --accent-ink:#1B1408; --accent-soft:rgba(227,178,98,.14);
  --rep-bg:rgba(227,178,98,.26); --rep-fg:#F0C77A;
  --dud-bg:rgba(236,104,132,.24); --dud-fg:#F59AAE;
  --coh-bg:rgba(120,160,240,.25); --coh-fg:#9DB4FF;
  --bien-bg:rgba(111,217,191,.20); --bien-fg:#6FD9BF;
  --ort-bg:rgba(255,128,110,.24); --ort-fg:#FF8D7E;
  --rec-bg:rgba(170,140,240,.26); --rec-fg:#C3ADF5;
  --pend-bg:rgba(181,168,147,.20); --pend-fg:#B5A893;
  --eco:#E3B262; --find:rgba(227,178,98,.33); --find-act:rgba(227,178,98,.7);
  --ok:#93E39F; --warn:#F0C77A; --bad:#FF8D7E; --toast-act:#8A5C16; --sel:rgba(227,178,98,.38);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --shadow-pop:0 14px 44px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 .9375rem/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
#app{min-height:100vh;display:flex;flex-direction:column}
#main{flex:1;min-width:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--sel)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* tipos de marca */
.rep{--t-bg:var(--rep-bg);--t-fg:var(--rep-fg)} .dud{--t-bg:var(--dud-bg);--t-fg:var(--dud-fg)}
.coh{--t-bg:var(--coh-bg);--t-fg:var(--coh-fg)} .bien{--t-bg:var(--bien-bg);--t-fg:var(--bien-fg)}
.ort{--t-bg:var(--ort-bg);--t-fg:var(--ort-fg)} .rec{--t-bg:var(--rec-bg);--t-fg:var(--rec-fg)}
.pend{--t-bg:var(--pend-bg);--t-fg:var(--pend-fg)} .all{--t-bg:var(--sunk);--t-fg:var(--ink)}

/* botones */
.btn{display:inline-flex;align-items:center;gap:.4rem;font:500 .8125rem/1 var(--f-ui);padding:.55rem .8rem;border:1px solid var(--line2);border-radius:7px;background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:.4rem .6rem;font-size:.75rem}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg,.ibtn svg{width:16px;height:16px;flex:none}
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer;flex:none}
.ibtn:hover{background:var(--accent-soft)}
.kbd{font:500 .6875rem/1 var(--f-mono);padding:.2rem .35rem;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;color:var(--soft);white-space:nowrap}
.label{font:500 .6562rem/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.muted{color:var(--soft)}
.field{display:flex;flex-direction:column;gap:.35rem;min-width:0}
.field>span{font:500 .75rem/1.2 var(--f-ui);color:var(--soft)}
.inp,.sel,.area{width:100%;min-width:0;padding:.55rem .65rem;border:1px solid var(--line2);border-radius:7px;background:var(--sheet);color:var(--ink);font:400 .875rem/1.4 var(--f-ui)}
.area{resize:vertical;min-height:5rem;line-height:1.5}
.inp:focus,.sel:focus,.area:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--top-h);display:flex;align-items:center;gap:.5rem;padding-left:var(--gl);padding-right:var(--gr);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font:italic 400 1.375rem/1 var(--f-display);border:0;background:none;cursor:pointer;padding:.2rem .1rem;white-space:nowrap;color:var(--ink)}
.brand b{font-style:normal;color:var(--accent);font-weight:400}
.crumbs{display:flex;align-items:center;gap:.35rem;min-width:0;overflow:hidden;font-size:.8125rem;color:var(--soft)}
.crumbs button{border:0;background:none;padding:.25rem .3rem;border-radius:5px;cursor:pointer;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.crumbs button:hover{color:var(--ink);background:var(--accent-soft)}
.crumbs .cur{color:var(--ink);font-weight:500}
.crumbs .sep{color:var(--faint)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:.35rem;flex:none}
.peers{display:flex;align-items:center}
.peer{width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);margin-left:-6px;overflow:hidden;background:var(--sunk);flex:none}
.peer img{width:100%;height:100%;display:block}
.save{font:400 .7188rem/1 var(--f-mono);color:var(--soft);white-space:nowrap;padding:0 .3rem}
.save.err{color:var(--bad)}
.save .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:.35rem;vertical-align:1px}
.save.busy .dot{background:var(--warn)}
.save.err .dot{background:var(--bad)}
@media (max-width:720px){ .crumbs{display:none} .save .txt{display:none} .top .hide-sm{display:none} .top{gap:.2rem} .brand{font-size:1.1875rem;min-width:0;overflow:hidden;text-overflow:ellipsis} .top-r{gap:0} .top .ibtn{width:32px} }

/* pie de estado */
.status{position:sticky;bottom:0;z-index:35;min-height:var(--status-h);display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding-left:var(--gl);padding-right:var(--gr);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);border-top:1px solid var(--line);font:400 .7188rem/1.2 var(--f-mono);color:var(--soft);font-variant-numeric:tabular-nums}
.status b{color:var(--ink);font-weight:500}
.status .grow{flex:1}
.status .rv{color:var(--accent)}

/* inicio */
.home{max-width:1120px;margin:0 auto;padding-block:2.2rem 4rem;padding-left:var(--gl);padding-right:var(--gr)}
.home-hero{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}
.home-hero h1{font:400 clamp(2.4rem,6vw,3.6rem)/1 var(--f-display);margin:0;letter-spacing:-.01em}
.home-hero h1 em{color:var(--accent)}
.home-hero p{margin:.6rem 0 0;color:var(--soft);max-width:52ch}
.home-hero .row{margin-left:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:1rem}
.pcard{position:relative;display:flex;flex-direction:column;gap:.7rem;min-height:190px;padding:1.2rem 1.2rem 1rem;border:1px solid var(--line);border-radius:4px;background:var(--sheet);box-shadow:var(--shadow);cursor:pointer;text-align:left;color:inherit;font:inherit}
.pcard:hover{border-color:var(--line2);transform:translateY(-1px)}
.pcard h3{font:400 1.75rem/1.05 var(--f-display);margin:0;overflow-wrap:anywhere}
.pcard .meta{display:flex;gap:.8rem;flex-wrap:wrap;font:400 .7188rem/1.2 var(--f-mono);color:var(--soft);margin-top:auto}
.pcard .bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.pcard .bar i{display:block;height:100%;background:var(--accent)}
.pcard .peek{font:italic 400 .95rem/1.45 var(--f-text);color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard.new{border-style:dashed;background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--soft)}
.pcard.new:hover{color:var(--ink);border-color:var(--soft)}
.pcard.new svg{width:28px;height:28px}
.home h2{font:400 1.6rem/1.1 var(--f-display);margin:2.4rem 0 .8rem}
.trash-list{display:flex;flex-direction:column;gap:.4rem}
.trash-item{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem .8rem;border:1px dashed var(--line2);border-radius:6px}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--soft);border:1px dashed var(--line2);border-radius:6px}

/* proyecto */
.proj{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - var(--top-h) - var(--status-h))}
.side{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--top-h) - var(--status-h) - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);padding:1.1rem .8rem 2rem max(.8rem,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:1.1rem;background:var(--bg)}
.side .ptitle{font:400 1.65rem/1.05 var(--f-display);margin:0 .3rem;overflow-wrap:anywhere}
.side .pkind{font:500 .6562rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:.4rem .3rem 0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;padding:.5rem .55rem;border:0;border-radius:6px;background:none;cursor:pointer;color:var(--soft);font-size:.875rem}
.nav button:hover{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav svg{width:16px;height:16px;flex:none;opacity:.8}
.chlist{display:flex;flex-direction:column;gap:1px;counter-reset:ch}
.chi{display:flex;align-items:center;gap:.25rem;border-radius:6px}
.chi:hover{background:var(--accent-soft)}
.chi.cur{background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.chi>button.go{flex:1;min-width:0;display:flex;align-items:baseline;gap:.5rem;text-align:left;padding:.45rem .4rem .45rem .55rem;border:0;background:none;cursor:pointer;color:var(--ink)}
.chi .n{font:400 .6875rem/1 var(--f-mono);color:var(--faint);width:1.6rem;flex:none;font-variant-numeric:tabular-nums}
.chi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.875rem}
.chi .w{font:400 .6875rem/1 var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.chi .dotp{width:6px;height:6px;border-radius:50%;flex:none}
.chi .more{opacity:0;width:26px;height:26px}
.chi:hover .more,.chi.cur .more,.chi .more:focus-visible{opacity:1}
.side-sec{display:flex;flex-direction:column;gap:.35rem}
.side-sec .hd{display:flex;align-items:center;justify-content:space-between;padding:0 .3rem}
.side .goal{padding:.2rem .3rem;font:400 .7188rem/1.4 var(--f-mono);color:var(--soft)}
.side .goal .bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:.35rem}
.side .goal .bar i{display:block;height:100%;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(14,12,11,.35);z-index:44}
@media (max-width:1100px){
  .proj{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:calc(var(--top-h) + env(safe-area-inset-top,0px));bottom:0;height:auto;width:min(300px,86vw);z-index:45;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow-pop)}
  .side.open{transform:none}
}
@media (min-width:1101px){ .only-narrow{display:none!important} .scrim{display:none} }

.stage{min-width:0;padding-block:1.2rem 3rem;padding-left:var(--gl);padding-right:var(--gr)}
.vhead{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin:0 auto 1.2rem;max-width:1100px}
.vhead h2{font:400 2.2rem/1 var(--f-display);margin:0}
.vhead p{margin:.35rem 0 0;color:var(--soft);max-width:60ch}
.vhead .row{margin-left:auto}

/* escritura */
.wbar{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;max-width:1080px;margin:0 auto .9rem;padding:.5rem 0;background:var(--bg)}
.chips{display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 0;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:.35rem;font:500 .75rem/1 var(--f-ui);padding:.32rem .55rem .32rem .32rem;border-radius:999px;border:1px solid var(--line2);background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip .g{display:inline-grid;place-items:center;width:1.25rem;height:1.25rem;border-radius:50%;background:var(--t-bg);color:var(--t-fg);font:600 .6875rem/1 var(--f-mono)}
.chip .c{font:500 .6562rem/1 var(--f-mono);color:var(--soft)}
.chip[aria-pressed="true"]{border-color:var(--t-fg)}
.chip[aria-pressed="false"]{background:transparent;color:var(--soft)}
.chip[aria-pressed="false"] .g{background:transparent;border:1px dashed var(--line2);color:var(--faint)}
.chip .lb{display:inline}
@media (max-width:1320px){ .chip .lb{display:none} .chip{padding-right:.45rem} }
.wbar .tools{display:flex;gap:.3rem;align-items:center;flex:none;margin-left:auto}

.write{display:grid;grid-template-columns:minmax(0,var(--measure,46rem)) minmax(230px,290px);gap:24px;justify-content:center;align-items:start}
.write.narrow{grid-template-columns:minmax(0,var(--measure,46rem))}
.notes-left .write:not(.narrow){grid-template-columns:minmax(230px,290px) minmax(0,var(--measure,46rem))}
.notes-left .write:not(.narrow) .margin{order:-1}
.paper{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);padding:clamp(1.4rem,5vw,3.6rem) clamp(1.1rem,5.5vw,var(--pad-x,4rem)) 7rem;min-width:0}
.flat .paper{background:transparent;border-color:transparent;box-shadow:none}
.justify .doc{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.ch-eyebrow{font:500 .6562rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center;margin-bottom:.8rem}
.ch-title{display:block;width:100%;border:0;background:transparent;text-align:center;font:400 clamp(2rem,5vw,2.8rem)/1.1 var(--f-display);color:var(--ink);padding:.1rem 0 .3rem;margin:0 0 2.2rem;border-bottom:1px solid transparent}
.ch-title:focus{outline:none;border-bottom-color:var(--line2)}
.doc{font:400 var(--text-size,clamp(1.06rem,2.3vw,1.19rem))/var(--leading,1.78) var(--f-text);font-optical-sizing:auto;outline:none;white-space:pre-wrap;overflow-wrap:break-word;min-height:40vh;caret-color:var(--accent)}
.doc p{margin:0;position:relative}
.doc.sangria p + p{text-indent:1.6em}
.doc.bloque p + p{margin-top:.9em}
.doc[contenteditable="true"]:empty::before,.doc .ph::before{content:attr(data-ph);color:var(--faint);font-style:italic;pointer-events:none}
.doc .m{background:var(--t-bg);border-radius:2px;padding:.03em 0;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:box-shadow .12s}
.doc .m::after{content:attr(data-n);font:600 .56em/1 var(--f-mono);color:var(--t-fg);margin-left:.16em;vertical-align:super;user-select:none;-webkit-user-select:none;pointer-events:none}
.doc .m.ort{background:none;text-decoration:underline wavy var(--t-fg);text-decoration-thickness:1.4px;text-underline-offset:.22em}
.doc .m.pend{background:none;border-bottom:1.5px dashed var(--t-fg);border-radius:0}
.doc .m.done{background:none;border-bottom:1px dotted var(--t-fg);border-radius:0;text-decoration:none}
.doc .m.active,.doc .m.hot{box-shadow:0 0 0 2px var(--t-fg)}
.doc .m.off{background:none!important;border:0!important;text-decoration:none!important;box-shadow:none!important;cursor:text}
.doc .m.off::after{content:none}
.clean .doc .m{background:none;border:0;text-decoration:none;box-shadow:none;cursor:text}
.clean .doc .m::after{content:none}
.clean .margin{display:none}
.doc p[data-peer]::before{content:attr(data-peer);position:absolute;left:-1.1rem;top:.2em;bottom:.2em;width:3px;border-radius:2px;background:var(--peer,var(--accent));font-size:0}
.doc p[data-peer]::after{content:attr(data-peer);position:absolute;left:-1.1rem;top:-1.1em;font:500 .625rem/1 var(--f-ui);color:var(--peer,var(--accent));text-indent:0;white-space:nowrap;transform:translateX(-50%)}
.doc p.dirty{box-shadow:-14px 0 0 -12px var(--line2)}
.doc p.rvw{box-shadow:-14px 0 0 -11px var(--accent);animation:rvw 1.2s ease-in-out infinite alternate}
@keyframes rvw{from{box-shadow:-14px 0 0 -11px var(--accent)}to{box-shadow:-14px 0 0 -12px var(--accent-soft)}}
::highlight(eco){text-decoration:underline dotted var(--eco);text-decoration-thickness:2px;text-underline-offset:.25em}
::highlight(busca){background-color:var(--find)}
::highlight(busca-act){background-color:var(--find-act)}
::highlight(larga){text-decoration:underline solid var(--faint);text-decoration-thickness:1px}

/* margen de notas */
.margin{position:relative;min-height:200px}
.note{position:absolute;left:0;right:0;background:var(--sheet);border:1px solid var(--line);border-left:3px solid var(--t-fg);border-radius:4px;padding:.55rem .65rem .6rem;font-size:.8125rem;line-height:1.45;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:top .18s ease,box-shadow .15s,border-color .15s;cursor:pointer}
.note.active{box-shadow:var(--shadow-pop);z-index:3;cursor:default}
.note.hot{border-color:var(--t-fg)}
.note.done{opacity:.6}
.note.done.active{opacity:1}
.nhead{display:flex;align-items:center;gap:.35rem;font:500 .6562rem/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--t-fg);margin-bottom:.3rem;flex-wrap:wrap}
.nhead .who{color:var(--soft);text-transform:none;letter-spacing:0;font-family:var(--f-ui);font-size:.7188rem;margin-left:auto}
.ntext{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note:not(.active) .ntext{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ntext.blank{color:var(--faint);font-style:italic}
.reps{display:flex;flex-direction:column;gap:.4rem;margin-top:.5rem;padding-top:.45rem;border-top:1px solid var(--line)}
.rep-i{font-size:.7812rem}
.rep-i b{font-weight:600}
.note:not(.active) .reps .rep-i:not(:last-child){display:none}
.nacts{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.55rem}
.note:not(.active) .nacts{display:none}
.act{font:500 .7188rem/1 var(--f-ui);padding:.4rem .55rem;border-radius:5px;border:1px solid var(--line2);background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap}
.act:hover{border-color:var(--soft)}
.act.primary{border-color:var(--accent);color:var(--accent)}
.act.warn{border-color:var(--bad);color:var(--bad)}
.note textarea{width:100%;min-height:4.2rem;margin-top:.2rem;resize:vertical;font:400 .8125rem/1.45 var(--f-ui);padding:.45rem .5rem;border:1px solid var(--line2);border-radius:5px;background:var(--bg);color:var(--ink)}
.note .fix{font:400 .7812rem/1.4 var(--f-text);margin:.35rem 0 0;padding:.3rem .45rem;background:var(--raised);border-radius:4px}
.note .fix del{color:var(--bad)} .note .fix ins{color:var(--ok);text-decoration:none}

/* nota abierta dentro de la hoja (pantallas angostas) */
.note.inline{position:absolute;z-index:6;box-shadow:var(--shadow-pop);cursor:default}
.nclose{display:inline-grid;place-items:center;width:24px;height:24px;margin:-4px -4px -4px .2rem;border:0;border-radius:5px;background:none;color:var(--soft);cursor:pointer;flex:none}
.nclose:hover{background:var(--accent-soft);color:var(--ink)}
.nclose svg{width:14px;height:14px}

/* barra flotante de selección */
.selbar{position:fixed;z-index:55;display:flex;gap:.2rem;padding:.3rem;background:var(--sheet);border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow-pop);align-items:center}
.selbar .tb{width:2rem;height:2rem;border-radius:6px;border:0;background:var(--t-bg);color:var(--t-fg);font:600 .8125rem/1 var(--f-mono);cursor:pointer}
.selbar .sep{width:1px;height:1.4rem;background:var(--line2);margin:0 .15rem}
.selbar .msg{font-size:.75rem;color:var(--soft);padding:0 .4rem}

/* foco */
.focus .side,.focus .wbar,.focus .margin,.focus .top,.focus .status{display:none}
.focus .proj{grid-template-columns:minmax(0,1fr)}
.focus .write{grid-template-columns:minmax(0,42rem)}
.focus .paper{background:transparent;border-color:transparent;box-shadow:none;padding-top:22vh;padding-bottom:50vh}
.focus .doc p{transition:opacity .25s}
.focus .doc.dim p:not(.cur){opacity:.28}
.marks-soft .doc .m:not(.off):not(.ort):not(.pend):not(.done){background:color-mix(in srgb,var(--t-bg) 45%,transparent)}
.marks-strong .doc .m:not(.off):not(.ort):not(.pend):not(.done){box-shadow:inset 0 -2px 0 var(--t-fg)}
.focus-exit{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(var(--gr) + 4px);z-index:50;opacity:.35;display:flex;gap:.35rem;transition:opacity .2s}
.focus-exit:hover{opacity:1}

/* cajón lateral */
@media (min-width:1000px){ body.has-drawer #main{padding-right:min(440px,40vw)} body.has-drawer .drawer{width:min(440px,40vw)} }
.drawer{position:fixed;top:calc(var(--top-h) + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(440px,100vw);z-index:48;background:var(--sheet);border-left:1px solid var(--line2);box-shadow:var(--shadow-pop);display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:.5rem;padding:.8rem max(16px,env(safe-area-inset-right,0px)) .8rem 1.1rem;border-bottom:1px solid var(--line)}
.drawer .dh h3{font:400 1.5rem/1 var(--f-display);margin:0;flex:1}
.drawer .db{flex:1;overflow:auto;padding:1rem max(16px,env(safe-area-inset-right,0px)) 2rem 1.1rem;display:flex;flex-direction:column;gap:.9rem}
.drawer .df{padding:.7rem max(16px,env(safe-area-inset-right,0px)) calc(.7rem + env(safe-area-inset-bottom,0px)) 1.1rem;border-top:1px solid var(--line);display:flex;gap:.5rem;flex-wrap:wrap}
.prose{font:400 .9375rem/1.6 var(--f-ui);overflow-wrap:anywhere}
.prose h4{font:400 1.25rem/1.2 var(--f-display);margin:1rem 0 .3rem}
.prose p{margin:.4rem 0}
.prose ul{margin:.3rem 0;padding-left:1.2rem}
.prose li{margin:.2rem 0}
.bubble{padding:.7rem .85rem;border-radius:8px;background:var(--raised);font-size:.875rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{background:var(--accent-soft);align-self:flex-end;max-width:90%}
.res{display:flex;flex-direction:column;gap:.25rem;border:1px solid var(--line);border-radius:6px;padding:.55rem .65rem;cursor:pointer;background:var(--bg)}
.res:hover{border-color:var(--line2)}
.res .snip{font:400 .875rem/1.45 var(--f-text);overflow-wrap:anywhere}
.res .snip mark{background:var(--find);color:inherit;border-radius:2px}
.res .where{font:400 .6875rem/1 var(--f-mono);color:var(--soft)}
.prop{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px}
.prop input{margin-top:.25rem}
.prop .pt{font-weight:600}
.prop .pd{font-size:.8125rem;color:var(--soft)}
.ver{display:flex;flex-direction:column;gap:.2rem;padding:.55rem .65rem;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--bg)}
.ver.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ver .vt{font-weight:600;font-size:.875rem}
.ver .vm{font:400 .6875rem/1.3 var(--f-mono);color:var(--soft)}
.diff{display:flex;flex-direction:column;gap:.35rem;font:400 .875rem/1.5 var(--f-text)}
.diff p{margin:0;padding:.2rem .5rem;border-left:3px solid transparent;border-radius:2px}
.diff .add{border-left-color:var(--ok);background:var(--bien-bg)}
.diff .del{border-left-color:var(--bad);background:var(--ort-bg);text-decoration:line-through;text-decoration-color:var(--bad)}
.diff .chg{border-left-color:var(--warn)}
.diff .same{color:var(--soft)}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(14,12,11,.45);display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:min(88vh,760px);overflow:auto;background:var(--sheet);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow-pop);padding:1.4rem 1.4rem 1.2rem;display:flex;flex-direction:column;gap:1rem}
.modal h3{font:400 1.8rem/1.05 var(--f-display);margin:0}
.modal .foot{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:.5rem}
.kopt{display:flex;flex-direction:column;gap:.15rem;padding:.6rem .7rem;border:1px solid var(--line2);border-radius:7px;cursor:pointer;text-align:left;background:var(--sheet)}
.kopt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kopt b{font:400 1.2rem/1 var(--f-display)}
.kopt span{font-size:.75rem;color:var(--soft)}
.drop{border:1.5px dashed var(--line2);border-radius:8px;padding:1.4rem;text-align:center;color:var(--soft);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

/* menú */
.menu{position:fixed;z-index:65;min-width:220px;max-width:min(320px,calc(100vw - 24px));background:var(--sheet);border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow-pop);padding:.35rem;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:0;background:none;padding:.5rem .6rem;border-radius:6px;cursor:pointer;font-size:.8438rem;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft);outline:none}
.menu button .k{margin-left:auto}
.menu button[aria-checked="true"]::before{content:"✓";color:var(--accent);width:1rem}
.menu button[aria-checked="false"]::before{content:"";width:1rem}
.menu .mh{font:500 .625rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:.6rem .6rem .3rem}
.menu hr{border:0;border-top:1px solid var(--line);margin:.3rem 0}
.menu button.danger{color:var(--bad)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--status-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:min(560px,calc(100vw - 32px))}
.toast div{pointer-events:auto;background:var(--ink);color:var(--sheet);font-size:.8438rem;line-height:1.4;padding:.6rem .9rem;border-radius:8px;box-shadow:var(--shadow-pop);display:flex;gap:.8rem;align-items:center}
.toast button{background:none;border:0;color:var(--toast-act);font-weight:600;cursor:pointer;padding:0}

/* biblia */
.bible{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:2rem}
.bsec .bhd{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem}
.bsec .bhd input{font:400 1.7rem/1.1 var(--f-display);border:0;background:transparent;padding:0;min-width:0;width:auto;flex:0 1 auto;color:var(--ink)}
.bsec .bhd input:focus{outline:none;border-bottom:1px solid var(--line2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:.8rem;align-items:start}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.55rem;min-width:0;box-shadow:var(--shadow)}
.card .ct{font:400 1.45rem/1.1 var(--f-display);border:0;background:transparent;padding:0;width:100%;color:var(--ink)}
.card .ct:focus{outline:none;border-bottom:1px solid var(--line2)}
.card .fl{display:grid;grid-template-columns:minmax(5.5rem,auto) minmax(0,1fr);gap:.25rem .6rem;align-items:baseline}
.card .fl label{font:500 .6875rem/1.2 var(--f-mono);color:var(--soft)}
.card .fl .fv{border:0;border-bottom:1px dashed transparent;background:transparent;padding:.15rem 0;font:400 .875rem/1.4 var(--f-ui);width:100%;min-width:0;color:var(--ink);resize:none;min-height:0;overflow:hidden}
.card .fl .fv:hover{border-bottom-color:var(--line2)}
.card .fl .fv:focus{outline:none;border-bottom-color:var(--accent);background:transparent}
.card textarea:not(.fv){border:1px solid transparent;background:var(--bg);border-radius:4px;padding:.45rem .5rem;font:400 .875rem/1.5 var(--f-ui);resize:vertical;min-height:3.2rem;color:var(--ink);width:100%}
.card textarea:not(.fv):focus{outline:none;border-color:var(--line2)}
.card .apps{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;font-size:.75rem;color:var(--soft)}
.card .apps button{font:400 .6875rem/1 var(--f-mono);padding:.25rem .4rem;border-radius:4px;border:1px solid var(--line2);background:none;cursor:pointer;color:var(--soft)}
.card .apps button:hover{color:var(--ink);border-color:var(--soft)}
.card .cfoot{display:flex;justify-content:flex-end}
.lst{display:flex;flex-direction:column;gap:.4rem}
.li{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem}
.li input.ti{font-weight:600;border:0;background:transparent;padding:0;width:100%;color:var(--ink)}
.li textarea{border:0;background:transparent;padding:0;resize:vertical;min-height:1.6rem;font:400 .8438rem/1.45 var(--f-ui);color:var(--soft);width:100%}
.li input:focus,.li textarea:focus{outline:none}
.li.done .ti{text-decoration:line-through;color:var(--soft)}
.pill{font:500 .625rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:.3rem .45rem;border-radius:3px;border:1px solid var(--line2);color:var(--soft);white-space:nowrap;background:none;cursor:pointer}
.pill.open{color:var(--rep-fg);border-color:var(--rep-fg);background:var(--rep-bg)}
.pill.done{color:var(--bien-fg);border-color:var(--bien-fg);background:var(--bien-bg)}

/* diagramas */
.dg{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:.6rem .9rem;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;color:var(--soft);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.canvas{background:var(--sheet);border:1px solid var(--line);border-radius:4px;overflow:auto;box-shadow:var(--shadow)}
.canvas svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.canvas svg text{font-family:var(--f-ui)}
.gnode{cursor:grab}
.gnode:active{cursor:grabbing}
.tl-table{width:100%;border-collapse:collapse;font-size:.875rem}
.tl-table th{font:500 .6562rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);text-align:left;padding:.4rem .4rem;border-bottom:1px solid var(--line2)}
.tl-table td{padding:.3rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.tl-table input,.tl-table select{width:100%;border:1px solid transparent;background:transparent;padding:.3rem .35rem;border-radius:4px;min-width:0;color:var(--ink)}
.tl-table input:hover,.tl-table select:hover{border-color:var(--line2)}
.tl-table input:focus,.tl-table select:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.tl-table .num{width:4.5rem}
.scrollx{overflow-x:auto}

/* estadísticas */
.st{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:1.2rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:.8rem}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:.9rem 1rem}
.tile .v{font:400 2.3rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile .k{font:500 .6562rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:.4rem}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:1rem 1.1rem;min-width:0}
.panel h3{font:400 1.4rem/1.1 var(--f-display);margin:0 0 .8rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1rem}
.wcloud{display:flex;flex-wrap:wrap;gap:.35rem}
.wcloud button{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:.3rem .55rem;font-size:.8125rem;cursor:pointer;color:var(--ink)}
.wcloud button b{font:500 .6875rem/1 var(--f-mono);color:var(--soft);margin-left:.3rem}
.longs{display:flex;flex-direction:column;gap:.5rem}
.longs button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:.5rem .6rem;cursor:pointer;font:400 .875rem/1.45 var(--f-text);color:var(--ink)}
.longs button span{display:block;font:400 .6875rem/1 var(--f-mono);color:var(--soft);margin-top:.3rem}
svg.chart text{fill:var(--soft);font:400 .6875rem var(--f-mono)}

/* ajustes */
.settings{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:1.2rem}
.settings .panel{display:flex;flex-direction:column;gap:.9rem}
.checks{display:flex;flex-wrap:wrap;gap:.4rem}
.checks label{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .6rem;border:1px solid var(--line2);border-radius:999px;font-size:.8125rem;cursor:pointer}

/* ayuda */
.keys{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1rem;align-items:center;font-size:.875rem}

@media (max-width:640px){
  .modal{padding:1.1rem}
  .wbar .tools .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* portada: secciones e introducción */
.sec-hd{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;margin:2.2rem 0 .8rem}
.sec-hd h2{font:400 1.6rem/1.1 var(--f-display);margin:0}
.sec-hd .muted{font-size:.85rem}
.home .sec-hd:first-of-type{margin-top:.6rem}
.pcard .more{width:28px;height:28px;margin:-6px -8px -6px 0}
.onboard{margin-top:1.2rem;display:flex;flex-direction:column;gap:.8rem}
.steps{margin:0;padding-left:1.3rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:.6rem 1.6rem}
.steps li{display:flex;flex-direction:column;gap:.15rem;font-size:.9rem}
.steps li span{color:var(--soft)}

/* panel de apariencia */
.look-panel{display:flex;flex-direction:column;gap:1.2rem}
.who-box{display:flex;gap:.7rem;align-items:center;padding:.7rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.who-box .av{width:38px;height:38px;border-radius:50%;flex:none}
.lk{display:flex;flex-direction:column;gap:.6rem}
.lk h4{font:500 .66rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0 0 .1rem}
.lrow{display:grid;grid-template-columns:minmax(6.5rem,8.5rem) minmax(0,1fr);gap:.6rem;align-items:center;font-size:.875rem}
.lrow>span{color:var(--soft)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.45rem}
.preset{display:flex;flex-direction:column;gap:.35rem;align-items:center;padding:.4rem;border:1px solid var(--line2);border-radius:8px;background:var(--sheet);cursor:pointer;font-size:.75rem;color:var(--ink)}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.preset .sw{position:relative;width:100%;height:2.4rem;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:space-around}
.preset .sw i{width:34%;height:58%;border-radius:2px;border-left:3px solid}
.accents{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.acc{width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--line2);cursor:pointer}
.accents input[type=color]{width:2rem;height:1.7rem;border:1px solid var(--line2);border-radius:6px;background:none;padding:1px;cursor:pointer}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:.42rem .7rem;font-size:.8rem;cursor:pointer;color:var(--soft)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rng{display:flex;gap:.6rem;align-items:center}
.rng input{flex:1;min-width:0;accent-color:var(--accent)}
.rng .rv{font:400 .72rem/1 var(--f-mono);color:var(--soft);min-width:3.6rem;text-align:right}
.samples{padding:.8rem .9rem;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
.sample-t{font-size:1.5rem;line-height:1.1;margin:0 0 .4rem}
.sample{margin:0;font-size:1.05rem;line-height:1.6}
@media (max-width:520px){ .lrow{grid-template-columns:minmax(0,1fr)} }

/* IA: botón y aviso */
.ai-pill{display:inline-flex;align-items:center;gap:.4rem;height:32px;padding:0 .75rem;border-radius:999px;font:500 .8rem/1 var(--f-ui);cursor:pointer;white-space:nowrap;border:1px solid var(--line2);background:var(--sheet);color:var(--ink)}
.ai-pill svg{width:15px;height:15px}
.ai-pill.off{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ai-pill.on{color:var(--ok)}
.ai-pill.on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ai-pill.on svg{display:none}
@media (max-width:720px){ .ai-pill .lbl{display:none} .ai-pill{padding:0 .55rem} .ai-pill.on::before{margin-right:-.2rem} }
.ai-banner{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;max-width:var(--measure,46rem);margin:0 auto 1rem;padding:.8rem 1rem;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft);font-size:.88rem;line-height:1.45}
.ai-banner>svg{width:20px;height:20px;color:var(--accent);flex:none}
.ai-banner>div:first-of-type{flex:1 1 18rem;min-width:0}
.ai-setup{display:flex;flex-direction:column;gap:.85rem}
.ai-steps{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.45rem;font-size:.88rem}
.ai-steps li{line-height:1.45}
.ai-steps .btn{margin-top:.3rem}
.ai-status{margin:0;font-size:.85rem;min-height:1.2em;color:var(--soft)}
.ai-status[data-k="ok"]{color:var(--ok)}
.ai-status[data-k="bad"]{color:var(--bad)}
.ai-adv summary{cursor:pointer;font-size:.85rem;color:var(--soft)}

/* ---------- retrato del estilo ---------- */
.style-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:.6rem}
.style-cell{border:1px solid var(--line);border-radius:4px;padding:.7rem .8rem;background:var(--bg);cursor:default}
.style-cell .k{font:500 .6562rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.style-cell .v{font:400 1.75rem/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:.3rem}
.style-cell .s{font-size:.75rem;color:var(--soft);margin-top:.2rem}
.style-panel h4,.habit h4{font:500 .7188rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:0 0 .55rem}
.style-hist{display:flex;flex-direction:column;gap:.4rem}
.style-hist .row,.style-hist-row{margin-bottom:.35rem}
.style-hist .lbl,.style-hist-row .lbl{flex:0 0 5.2rem;font-size:.8125rem}
.style-hist .bar,.style-hist-row .bar{flex:1;height:10px;border-radius:2px;background:var(--sunk);overflow:hidden;min-width:0}
.style-hist .bar>span,.style-hist-row .bar>span{display:block;height:100%;background:var(--accent)}
.style-hist .n,.style-hist-row .n{flex:0 0 4.2rem;text-align:right;font:400 .7188rem var(--f-mono);color:var(--soft);font-variant-numeric:tabular-nums}
.style-table{width:100%;border-collapse:collapse;font-size:.8438rem;font-variant-numeric:tabular-nums}
.style-table th{text-align:left;font:500 .6562rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:.35rem .5rem;border-bottom:1px solid var(--line)}
.style-table td{padding:.4rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
.style-table td:first-child{white-space:normal;min-width:8rem}
.style-table tbody tr:hover{background:var(--accent-soft)}
.style-table td.off{font-style:italic;color:var(--accent);font-weight:600}

/* ---------- rachas ---------- */
.habit{display:flex;flex-direction:column}
.habit-nudge{margin:0 0 .8rem;font:400 1.05rem/1.4 var(--f-display)}
.habit-tiles .tile.on .v{color:var(--accent)}
.habit-tiles .tile .v{font-size:1.9rem}
.heat-wrap{margin-top:1rem;overflow-x:auto}
.heat text{font:400 9px var(--f-mono);fill:var(--soft)}
.heat rect.h0,.heat-legend i.h0{fill:var(--sunk);background:var(--sunk)}
.heat rect.h1,.heat-legend i.h1{fill:color-mix(in srgb,var(--accent) 30%,var(--sunk));background:color-mix(in srgb,var(--accent) 30%,var(--sunk))}
.heat rect.h2,.heat-legend i.h2{fill:color-mix(in srgb,var(--accent) 55%,var(--sunk));background:color-mix(in srgb,var(--accent) 55%,var(--sunk))}
.heat rect.h3,.heat-legend i.h3{fill:color-mix(in srgb,var(--accent) 78%,var(--sunk));background:color-mix(in srgb,var(--accent) 78%,var(--sunk))}
.heat rect.h4,.heat-legend i.h4{fill:var(--accent);background:var(--accent)}
.heat rect.today{stroke:var(--ink);stroke-width:1.2}
.heat-legend{display:flex;align-items:center;gap:3px;margin-top:.4rem;font:400 .6875rem var(--f-mono);color:var(--soft)}
.heat-legend i{display:inline-block;width:11px;height:11px;border-radius:2px}
.heat-legend span{margin:0 .3rem}
.habit-mini-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.habit-mini-row>div{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;padding:.5rem .6rem;background:var(--bg)}
.habit-mini-row b{font:400 1.45rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.habit-mini-row span{font:500 .6rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-top:.2rem}
.habit-mini .btn{margin-top:.6rem}

/* ---------- explicaciones al pasar el cursor ---------- */
.has-tip{position:relative;cursor:help}
.has-tip:focus{outline:none}
.has-tip:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.tip-q{position:absolute;top:.45rem;right:.5rem;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);color:var(--soft);font:600 .6rem/13px var(--f-ui);text-align:center;opacity:.75}
.tip-h{display:inline-flex;align-items:center;gap:.4rem;padding-right:1.4rem}
.tip-h .tip-q{top:50%;transform:translateY(-50%);right:0}
.tip{position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:max(100%,15rem);max-width:min(21rem,86vw);padding:.65rem .75rem;border-radius:5px;background:var(--ink);color:var(--bg);font:400 .7812rem/1.45 var(--f-ui);letter-spacing:0;text-transform:none;text-align:left;white-space:normal;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;visibility:hidden;transform:translateY(-3px);transition:opacity .12s,transform .12s,visibility .12s;pointer-events:none}
.tip.flip{left:auto;right:0}
.tip.up{top:auto;bottom:calc(100% + 6px)}
.has-tip:hover>.tip,.has-tip:focus-visible>.tip,.has-tip.show>.tip{opacity:1;visibility:visible;transform:none}
.has-tip:hover>.tip-q,.has-tip.show>.tip-q{opacity:1;border-color:var(--accent);color:var(--accent)}
.style-guide{margin:0 0 1rem;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.style-guide>summary{cursor:pointer;padding:.55rem .8rem;font-size:.8438rem;color:var(--accent);font-weight:500}
.style-guide[open]>summary{border-bottom:1px solid var(--line)}
.style-guide>*:not(summary){margin-left:.9rem;margin-right:.9rem}
.style-guide h5{font:400 1.1rem/1.2 var(--f-display);margin:.9rem .9rem .4rem}
.style-guide p{font-size:.8438rem;line-height:1.55;margin-top:.3rem;margin-bottom:.5rem}
.style-guide .formula{font:400 .95rem var(--f-mono);background:var(--sunk);display:inline-block;padding:.35rem .6rem;border-radius:3px}
.style-guide .scale{margin-bottom:.6rem;width:calc(100% - 1.8rem)}
.style-guide .scale tr.me td{background:var(--accent-soft);font-weight:600}
.style-guide dl{display:grid;grid-template-columns:minmax(8rem,11rem) 1fr;gap:.45rem .9rem;font-size:.8125rem;line-height:1.5;margin-top:.3rem}
.style-guide dt{font-weight:600}
.style-guide dd{margin:0;color:var(--ink)}
@media (max-width:640px){.style-guide dl{grid-template-columns:1fr}.style-guide dd{margin-bottom:.4rem}}
.style-cell .k,.tile.has-tip .k{padding-right:1.2rem}

/* ---------- métrica ---------- */
.doc.show-met>p[data-met]::before{content:attr(data-met);position:absolute;right:100%;margin-right:1rem;top:.5em;font:500 .625rem/1 var(--f-mono);letter-spacing:.04em;color:var(--soft);white-space:nowrap;text-indent:0;user-select:none;-webkit-user-select:none;pointer-events:none}
.doc.show-met>p.met-off[data-met]::before{color:var(--accent);font-weight:700}
@media (max-width:860px){
  .doc.show-met>p[data-met]::before{content:none}
  .doc.show-met>p[data-met]::after{content:attr(data-met);font:500 .58rem/1 var(--f-mono);color:var(--soft);margin-left:.5rem;vertical-align:.2em;user-select:none;-webkit-user-select:none;pointer-events:none;white-space:nowrap}
  .doc.show-met>p.met-off[data-met]::after{color:var(--accent);font-weight:700}
}
.met-panel{display:flex;flex-direction:column;gap:.9rem}
.met-sum{display:flex;flex-direction:column;gap:.45rem;border:1px solid var(--line);border-radius:4px;padding:.8rem .9rem;background:var(--sheet)}
.met-form b{display:block;font:400 1.45rem/1.15 var(--f-display)}
.met-form span{display:block;font-size:.8125rem;color:var(--soft);margin-top:.2rem}
.met-line{display:flex;gap:.6rem;font-size:.8438rem;padding-right:1.4rem}
.met-line .k{flex:0 0 4.5rem;font:500 .6562rem/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.met-line .mono{font-family:var(--f-mono);letter-spacing:.08em}
.met-line .tip-q{top:.15rem}
.met-stanza{display:flex;flex-direction:column;gap:.15rem}
.met-sh{display:flex;align-items:center;justify-content:space-between;font:500 .6562rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:.2rem 0 .3rem;border-bottom:1px solid var(--line)}
.met-sh b{font:600 .75rem var(--f-ui);letter-spacing:0;text-transform:none;color:var(--accent);padding-right:1.3rem}
.met-sh .tip-q{top:50%;transform:translateY(-50%);right:0}
.met-row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) 1.6rem;gap:.6rem;align-items:start;padding:.5rem .2rem;border-bottom:1px dashed var(--line);cursor:pointer;border-radius:3px}
.met-row:hover{background:var(--accent-soft)}
.met-n{font:400 1.35rem/1 var(--f-display);font-variant-numeric:tabular-nums;text-align:center;padding-top:.1rem}
.met-n .tip-q,.met-r .tip-q{display:none}
.met-row.off .met-n{color:var(--accent);font-weight:600}
.met-r{font:600 .9rem/1.6 var(--f-mono);text-align:center;color:var(--accent)}
.met-v{font:400 1rem/1.4 var(--f-text)}
.met-syl{font:400 .75rem/1.6 var(--f-mono);color:var(--soft)}
.met-syl span{white-space:nowrap}
.met-syl i{font-style:normal;opacity:.5}
.met-syl .ms-a{color:var(--ink);font-weight:700}
.met-syl .ms-s{text-decoration:underline dotted;text-underline-offset:.2em}
.met-syl .ms-adj{font-style:normal;color:var(--accent)}
.met-note{font-size:.75rem;color:var(--soft);margin-top:.15rem}
.met-row.off .met-note{color:var(--accent)}
.met-panel .tip{max-width:min(19rem,80vw)}

.doc.show-met>p{text-indent:0!important}

/* ---------- páginas y navegación ---------- */
.doc>p.pb{margin-top:2.6rem}
.doc>p.pb::before{content:'salto de página';position:absolute;left:0;right:0;top:-1.75rem;border-top:1px dashed var(--line2);font:500 .58rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center;padding-top:.35rem;text-indent:0;user-select:none;-webkit-user-select:none;pointer-events:none}
.paper.paged{overflow:hidden}
.paper.paged .doc>p.pg-start{margin-top:7.5rem}
.paper.paged .doc>p.pg-start::before{content:'— ' attr(data-pg) ' —';position:absolute;left:-50vw;right:-50vw;top:-6.6rem;height:4.4rem;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:inset 0 10px 14px -12px rgba(0,0,0,.18),inset 0 -10px 14px -12px rgba(0,0,0,.18);font:500 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:none;color:var(--soft);display:flex;align-items:center;justify-content:center;transform:translateY(-1.1rem);text-indent:0;user-select:none;-webkit-user-select:none;pointer-events:none}
.paper.paged .doc>p.pg-start.pb::before{content:'— ' attr(data-pg) ' —   ·   salto de página'}
.paper.paged .doc[data-pages]::after{content:'— ' attr(data-pages) ' —';display:block;text-align:center;font:500 .7rem/1 var(--f-mono);color:var(--soft);margin-top:2.5rem}
.chi.special .n{color:var(--accent);font-weight:700}
.chi.special .t{font-style:italic}
.st-page{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}
.st-page:hover{color:var(--accent)}
.pal{display:flex;flex-direction:column;gap:.6rem;min-width:min(26rem,80vw)}
.pal-list{max-height:min(55vh,26rem);overflow:auto;display:flex;flex-direction:column}
.pal-g{font:500 .6562rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:.6rem .4rem .25rem}
.pal-it{display:flex;justify-content:space-between;gap:.8rem;border:0;background:none;text-align:left;padding:.45rem .55rem;border-radius:3px;cursor:pointer;color:var(--ink);font:inherit;font-size:.9rem}
.pal-it .s{color:var(--soft);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.pal-it.on,.pal-it:hover{background:var(--accent-soft)}

/* ---------- partes y carpetas ---------- */
.chi.part{margin-top:.5rem}
.chi.part .go{font-weight:600}
.chi.part .go .t{font:500 .7188rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.chi.part .tog{border:0;background:none;color:var(--soft);cursor:pointer;width:1.4rem;padding:0;font-size:.75rem;flex:0 0 auto}
.chi.in-part .go{padding-left:1.4rem}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin:-.4rem 0 1rem}
.fbar .spacer{flex:1}
.fchip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line2);background:var(--sheet);border-radius:999px;padding:.32rem .7rem;font-size:.8125rem;color:var(--ink);cursor:pointer}
.fchip svg{width:14px;height:14px}
.fchip b{font:500 .6875rem var(--f-mono);color:var(--soft)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchip.on b{color:var(--accent-ink);opacity:.8}
.fchip.add{border-style:dashed;background:none;color:var(--soft)}
.pgroup{grid-column:1/-1;display:flex;align-items:center;gap:.45rem;border:0;background:none;padding:.6rem 0 0;cursor:pointer;color:var(--ink);font:400 1.15rem var(--f-display);text-align:left}
.pgroup svg{width:16px;height:16px;color:var(--accent)}
.pgroup b{font:500 .7rem var(--f-mono);color:var(--soft)}
.join{display:flex;flex-direction:column;gap:.8rem;min-width:min(30rem,82vw)}
.join-list{display:flex;flex-direction:column;max-height:min(40vh,18rem);overflow:auto;border:1px solid var(--line);border-radius:4px}
.join-it{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.6rem;padding:.5rem .7rem;border-bottom:1px solid var(--line);cursor:pointer}
.join-it input{grid-row:1/3;align-self:center}
.join-it .t{font-size:.9rem}
.join-it .s{font-size:.75rem;color:var(--soft)}
.join-it:hover{background:var(--accent-soft)}

/* ---------- navegación entre capítulos ---------- */
.ch-nav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:1rem;margin-top:3.5rem;padding-top:1.4rem;position:relative}
.ch-nav::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.cn-link{display:flex;align-items:center;gap:.7rem;border:0;background:none;padding:.4rem .2rem;cursor:pointer;color:var(--ink);min-width:0;font:inherit;border-radius:4px;transition:color .15s}
.cn-link.next{justify-content:flex-end;text-align:right}
.cn-link.prev{text-align:left}
.cn-arrow{font:400 1.1rem var(--f-display);color:var(--soft);transition:transform .18s ease,color .15s}
.cn-txt{display:flex;flex-direction:column;min-width:0}
.cn-k{font:500 .625rem/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.cn-t{font:italic 400 1.02rem/1.3 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn-link:hover .cn-t{color:var(--accent)}
.cn-link.prev:hover .cn-arrow{transform:translateX(-3px);color:var(--accent)}
.cn-link.next:hover .cn-arrow{transform:translateX(3px);color:var(--accent)}
.cn-mid{display:flex;gap:.15rem;align-items:center}
.cn-ico{width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--soft);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.cn-ico svg{width:16px;height:16px}
.cn-ico:hover{background:var(--accent-soft);color:var(--accent)}
@media (max-width:640px){.ch-nav{grid-template-columns:1fr 1fr;row-gap:.4rem}.cn-mid{grid-column:1/-1;grid-row:1;justify-content:center}}

/* ---------- modo lectura ---------- */
body.reading{overflow:hidden}
.reader{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;outline:none;animation:rd-in .25s ease}
@keyframes rd-in{from{opacity:0}to{opacity:1}}
.rd-top{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.5rem .9rem;height:52px;flex:0 0 auto}
.rd-ttl{min-width:0;font-size:.875rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-ttl b{font:400 1.05rem var(--f-display);color:var(--ink)}
.rd-ctl{display:flex;align-items:center;gap:.4rem;flex:0 0 auto}
.rd-seg button{font-size:.75rem;padding:.25rem .55rem}
.rd-tog{border:1px solid var(--line2);background:none;border-radius:999px;padding:.25rem .65rem;font-size:.75rem;color:var(--soft);cursor:pointer}
.rd-tog[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.rd-stage{flex:1;display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:0}
.rd-book{position:relative;background:var(--sheet);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 40px -12px rgba(0,0,0,.25);user-select:none;-webkit-user-select:none;perspective:7000px}
.reader.spread .rd-book::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:60px;margin-left:-30px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.07) 45%,rgba(0,0,0,.12) 50%,rgba(0,0,0,.07) 55%,transparent);pointer-events:none}
.rd-clip{position:absolute;inset:0;overflow:hidden;border-radius:3px}
.rd-flow{column-fill:auto;font:400 var(--text-size,19px)/var(--leading,1.78) var(--f-text);color:var(--ink);will-change:transform;text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.rd-flow p{margin:0;text-indent:1.5em;orphans:2;widows:2}
.rd-flow h2+p,.rd-flow .rd-eb+h2+p,.rd-flow p.rd-blank+p{text-indent:0}
.reader.poesia .rd-flow{text-align:left;-webkit-hyphens:manual;hyphens:manual}
.reader.poesia .rd-flow p{text-indent:0;white-space:pre-wrap}
.rd-flow p.rd-blank{height:1em}
.rd-ch{break-before:column}
.rd-ch:first-child{break-before:auto}
.rd-eb{font:500 .66rem/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);text-align:center;margin:2.2em 0 .6em}

/* ============ fusión de tres vías (para colaborar sin pisarse) ============ */
function deq(a, b) {
  if (a === b) return true;
  if (a == null || b == null || typeof a !== 'object' || typeof b !== 'object') return false;
  const aa = Array.isArray(a), ba = Array.isArray(b);
  if (aa !== ba) return false;
  if (aa) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (!deq(a[i], b[i])) return false;
    return true;
  }
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  for (const k of ka) if (!Object.prototype.hasOwnProperty.call(b, k) || !deq(a[k], b[k])) return false;
  return true;
}
const isIdArr = (a) => Array.isArray(a) && a.every(x => x && typeof x === 'object' && !Array.isArray(x) && typeof x.id === 'string');

function merge3(b, l, r) {
  if (deq(l, r)) return l;
  if (deq(l, b)) return r;
  if (deq(r, b)) return l;
  if (isIdArr(l) && isIdArr(r) && (b == null || isIdArr(b))) return mergeList(b || [], l, r);
  if (l && r && typeof l === 'object' && typeof r === 'object' && !Array.isArray(l) && !Array.isArray(r)) {
    const bb = (b && typeof b === 'object' && !Array.isArray(b)) ? b : {};
    const out = {};
    const keys = new Set(Object.keys(l).concat(Object.keys(r), Object.keys(bb)));
    keys.forEach(k => {
      const inL = Object.prototype.hasOwnProperty.call(l, k), inR = Object.prototype.hasOwnProperty.call(r, k), inB = Object.prototype.hasOwnProperty.call(bb, k);
      if (inL && inR) out[k] = merge3(bb[k], l[k], r[k]);
      else if (inL) { if (!inB || !deq(bb[k], l[k])) out[k] = l[k]; }
      else if (inR) { if (!inB || !deq(bb[k], r[k])) out[k] = r[k]; }
    });
    return out;
  }
  return l;
}

function mergeList(b, l, r) {
  const idx = (a) => { const m = new Map(); a.forEach(x => m.set(x.id, x)); return m; };
  const B = idx(b), L = idx(l), R = idx(r);
  const ord = (a) => a.map(x => x.id).join('\u0001');
  const useLocal = ord(l) !== ord(b) && ord(r) === ord(b);
  const primary = useLocal ? l : r, other = useLocal ? r : l;
  const decide = (id) => {
    const bi = B.get(id), li = L.get(id), ri = R.get(id);
    if (li && ri) return bi ? merge3(bi, li, ri) : li;
    if (li) return (!bi || !deq(bi, li)) ? li : null;
    if (ri) return (!bi || !deq(bi, ri)) ? ri : null;
    return null;
  };
  const out = [], placed = new Set();
  primary.forEach(x => { placed.add(x.id); const v = decide(x.id); if (v) out.push(v); });
  other.forEach((x, i) => {
    if (placed.has(x.id)) return;
    placed.add(x.id);
    const v = decide(x.id);
    if (!v) return;
    let pos = 0;
    for (let j = i - 1; j >= 0; j--) { const k = out.findIndex(o => o.id === other[j].id); if (k >= 0) { pos = k + 1; break; } }
    out.splice(pos, 0, v);
  });
  return out;
}

/* Respaldo local cuando la página no tiene base compartida (por ejemplo, abierta fuera de claude.ai). */
function makeLocalDB() {
  const KEY = 'mde-localdb-v1';
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { store = {}; }
  const listeners = new Set();
  const persist = debounce(() => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }, 400);
  const parent = (p) => p.split('/').slice(0, -1).join('/');
  const snapDoc = (p) => { const d = store[p]; return { id: p.split('/').pop(), exists: !!d, data: () => (d ? clone(d) : undefined), metadata: { fromCache: false, hasPendingWrites: false } }; };
  const snapColl = (c, q) => {
    let docs = Object.keys(store).filter(p => parent(p) === c).map(snapDoc);
    if (q && q.order) { const [f, dir] = q.order; docs.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; return (x > y ? 1 : x < y ? -1 : 0) * (dir === 'desc' ? -1 : 1); }); }
    if (q && q.lim) docs = docs.slice(0, q.lim);
    return { docs: docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  };
  const notify = (p) => setTimeout(() => listeners.forEach(l => {
    if (l.kind === 'doc' && l.path === p) l.cb(snapDoc(p));
    if (l.kind === 'coll' && parent(p) === l.path) l.cb(snapColl(l.path, l.q));
  }), 0);
  const docRef = (p) => ({
    id: p.split('/').pop(), path: p,
    get: async () => snapDoc(p),
    set: async (d) => { store[p] = clone(d); persist(); notify(p); },
    update: async (d) => { if (!store[p]) throw { code: 'invalid_argument', message: 'missing' }; Object.assign(store[p], clone(d)); persist(); notify(p); },
    delete: async () => { delete store[p]; persist(); notify(p); },
    onSnapshot: (cb) => { const l = { kind: 'doc', path: p, cb }; listeners.add(l); setTimeout(() => cb(snapDoc(p)), 0); return () => listeners.delete(l); },
    collection: (c) => collRef(p + '/' + c)
  });
  const query = (c, q) => ({
    orderBy: (f, dir) => query(c, Object.assign({}, q, { order: [f, dir || 'asc'] })),
    limit: (n) => query(c, Object.assign({}, q, { lim: n })),
    where: () => query(c, q),
    get: async () => snapColl(c, q),
    onSnapshot: (cb) => { const l = { kind: 'coll', path: c, q, cb }; listeners.add(l); setTimeout(() => cb(snapColl(c, q)), 0); return () => listeners.delete(l); }
  });
  const collRef = (c) => Object.assign(query(c, {}), {
    path: c,
    doc: (id) => docRef(c + '/' + (id || uid())),
    add: async (d) => { const r = docRef(c + '/' + uid()); await r.set(d); return r; }
  });
  return { doc: docRef, collection: collRef };
}

const Store = {
  err: null, lastSaved: 0, docs: new Set(),
  pendingCount() { let n = 0; this.docs.forEach(d => { if (d.pending || d.saving) n++; }); return n; },
  setStatus: rafThrottle(() => { if (window.App && App.renderSaveStatus) App.renderSaveStatus(); }),
  flushAll() { this.docs.forEach(d => d.flush()); }
};
const PERMANENT = new Set(['invalid_argument', 'quota_exceeded', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed']);

class SyncDoc {
  constructor(ref, coll) {
    this.ref = ref; this.id = ref.id; this.coll = coll;
    this.data = null; this.base = null; this.baseV = null; this.exists = false;
    this.pending = false; this.saving = false; this.deleted = false;
    this.lastWrittenV = null; this.remoteDuringSave = false; this.timer = null; this.err = null;
    this.states = new Map();
    Store.docs.add(this);
  }
  sig(d) { return d ? JSON.stringify(d, (k, v) => (k && k[0] === '_') ? undefined : v) : ''; }
  remember(v, d) {
    if (!v) return;
    this.states.set(v, d);
    if (this.states.size > 48) this.states.delete(this.states.keys().next().value);
  }
  /* Cada escritura lleva su versión (_v), la versión de la que partió (_pv) y una cadena corta de
     versiones anteriores (_anc). Si llega una versión que no partió de la nuestra, es una edición
     simultánea: se fusiona con el ancestro común más reciente que conocemos, para que nadie pierda su trabajo. */
  ancestorOf(data) {
    const chain = [data._pv].concat(data._anc || []).filter(Boolean);
    for (const id of chain) if (id === this.baseV || id === this.lastWrittenV || this.states.has(id)) return id;
    return null;
  }
  remote(data, meta) {
    if (this.deleted || !data) return;
    if (meta && meta.hasPendingWrites) return;
    this.exists = true;
    const v = data._v || null;
    if (v && v === this.baseV) return;
    this.remember(v, data);
    const s = this.sig(data);
    if (this.data && s === this.sig(this.data)) {
      this.base = data; this.baseV = v;
      if (!this.saving && !this.timer) this.pending = false;
      return;
    }
    if (v && v === this.lastWrittenV) {
      this.base = data; this.baseV = v;
      if (this.saving) this.remoteDuringSave = true;
      if (this.data && this.sig(this.data) !== s) { this.pending = true; this.schedule(); }
      return;
    }
    if (this.saving) this.remoteDuringSave = true;
    const anc = this.ancestorOf(data);
    if (this.trace) this.trace.push('recv ' + v + ' anc=' + anc + ' base=' + this.baseV + ' lw=' + this.lastWrittenV + ' pend=' + this.pending + ' sav=' + this.saving);
    const direct = anc && (anc === this.baseV || anc === this.lastWrittenV);
    if (!this.data || (!this.pending && !this.saving && (direct || (!anc && !this.lastWrittenV)))) {
      this.data = clone(data); this.base = data; this.baseV = v; this.emit('remote'); return;
    }
    const ancState = (anc && (this.states.get(anc) || (anc === this.baseV ? this.base : null))) || this.base || {};
    const merged = merge3(ancState, this.data, clone(data));
    this.data = merged; this.base = data; this.baseV = v;
    if (this.sig(merged) !== s) { this.pending = true; this.schedule(); }
    this.emit('merge');
  }
  update(fn, opts) {
    if (!RT.canWrite) return false;
    if (!this.data) this.data = {};
    fn(this.data);
    this.pending = true;
    this.schedule(opts && opts.now ? 10 : 800);
    if (!(opts && opts.silent)) this.emit('local');
    return true;
  }
  schedule(ms) {
    if (this.deleted) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.save(), ms == null ? 800 : ms);
    Store.setStatus();
  }
  flush() { if (this.timer) { clearTimeout(this.timer); this.timer = null; this.save(); } }
  async save() {
    this.timer = null;
    if (this.deleted || !this.pending) { Store.setStatus(); return; }
    if (this.saving) { this.schedule(400); return; }
    const payload = clone(this.data);
    payload._at = Date.now();
    payload._by = RT.me || null;
    payload._v = uid('v');
    payload._pv = this.baseV || null;
    payload._anc = this.base ? [this.base._pv].concat(this.base._anc || []).filter(Boolean).slice(0, 12) : [];
    const s = this.sig(payload);
    this.lastWrittenV = payload._v;
    this.remember(payload._v, payload);
    this.saving = true; this.remoteDuringSave = false;
    Store.setStatus();
    try {
      await this.ref.set(payload);
      this.exists = true; this.err = null; Store.err = null; Store.lastSaved = Date.now();
      if (!this.remoteDuringSave) { this.base = payload; this.baseV = payload._v; }
      if (this.sig(this.data) === s) this.pending = false; else this.schedule(300);
    } catch (e) {
      const code = (e && e.code) || 'error';
      this.err = code; Store.err = { code: code, doc: this };
      if (!PERMANENT.has(code)) this.schedule(4000 + Math.random() * 2000);
      if (window.App && App.onSaveError) App.onSaveError(this, code, e);
    } finally {
      this.saving = false;
      Store.setStatus();
    }
  }
  emit(kind) { if (this.coll && this.coll.onDoc) this.coll.onDoc(this, kind); }
  dispose() { Store.docs.delete(this); clearTimeout(this.timer); }
}

class Coll {
  constructor(path, opts) {
    this.path = path; this.ref = RT.db.collection(path);
    this.docs = new Map(); this.ready = false;
    this.onChange = opts && opts.onChange; this.onDoc = opts && opts.onDoc;
    this.unsub = this.ref.onSnapshot((snap) => this.onSnap(snap), (err) => {
      this.error = err; if (window.App && App.onSyncError) App.onSyncError(this, err);
    });
  }
  onSnap(snap) {
    const seen = new Set();
    snap.docs.forEach(d => {
      seen.add(d.id);
      let sd = this.docs.get(d.id);
      if (!sd) { sd = new SyncDoc(this.ref.doc(d.id), this); this.docs.set(d.id, sd); }
      sd.remote(d.data(), d.metadata);
    });
    this.docs.forEach((sd, id) => {
      if (!seen.has(id) && sd.exists && !sd.pending && !sd.saving) { sd.dispose(); this.docs.delete(id); }
    });
    this.ready = true;
    if (this.onChange) this.onChange(this);
  }
  get(id) { return this.docs.get(id) || null; }
  list() { return Array.from(this.docs.values()).filter(d => d.data); }
  create(id, data) {
    const sd = new SyncDoc(this.ref.doc(id), this);
    sd.data = data; sd.pending = true;
    this.docs.set(id, sd);
    sd.schedule(10);
    return sd;
  }
  async remove(id) {
    const sd = this.docs.get(id);
    if (sd) { sd.deleted = true; sd.dispose(); }
    this.docs.delete(id);
    try { await this.ref.doc(id).delete(); } catch (e) {}
  }
  close() { if (this.unsub) this.unsub(); this.docs.forEach(d => { d.flush(); }); }
}

const IDB = {
  db: null, dirty: new Set(), store: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('maquina-de-escribir', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('docs');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async load() {
    this.db = await this.open();
    const store = new Map();
    await new Promise((res, rej) => {
      const tx = this.db.transaction('docs', 'readonly'), os = tx.objectStore('docs');
      const c = os.openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { store.set(cur.key, cur.value); cur.continue(); } else res(); };
      c.onerror = () => rej(c.error);
    });
    this.store = store;
    if (!store.size) {
      try {
        const old = JSON.parse(localStorage.getItem('mde-localdb-v1') || '{}');
        Object.keys(old).forEach(k => { store.set(k, old[k]); this.dirty.add(k); });
        if (this.dirty.size) this.flush();
      } catch (e) {}
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    return store;
  },
  mark(p) { this.dirty.add(p); this.flushSoon(); },
  flushSoon: debounce(function () { IDB.flush(); }, 250),
  flush() {
    if (!this.db || !this.dirty.size) return;
    const keys = Array.from(this.dirty); this.dirty.clear();
    try {
      const tx = this.db.transaction('docs', 'readwrite'), os = tx.objectStore('docs');
      keys.forEach(k => { const v = this.store.get(k); if (v === undefined) os.delete(k); else os.put(v, k); });
      tx.onerror = () => { keys.forEach(k => this.dirty.add(k)); App.toast('No se pudo guardar en este navegador. Exporta un respaldo.'); };
    } catch (e) { keys.forEach(k => this.dirty.add(k)); }
  }
};

async function makeIdbDB() {
  const store = await IDB.load();
  return makeMemDB(store, (p) => IDB.mark(p));
}

function parseJsonLoose(t) {
  const tries = [t];
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) tries.push(fence[1]);

}

/* Mini markdown seguro para informes de Claude. */
function renderProse(text) {
  const root = h('div', { class: 'prose' });
  let list = null;
  const inline = (s, el) => {
    const parts = s.split(/(\*\*[^*]+\*\*|«[^»]+»)/g);
    parts.forEach(p => {
      if (/^\*\*[^*]+\*\*$/.test(p)) el.append(h('b', { text: p.slice(2, -2) }));
      else el.append(p);
    });
    return el;
  };
  text.split('\n').forEach(line => {
    const t = line.trim();
    if (!t) { list = null; return; }
    const hm = t.match(/^#{1,4}\s+(.*)$/);
    if (hm) { list = null; root.append(inline(hm[1].replace(/\*\*/g, ''), h('h4'))); return; }
    const lm = t.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (lm) { if (!list) { list = h('ul'); root.append(list); } list.append(inline(lm[1], h('li'))); return; }
    list = null;
    root.append(inline(t, h('p')));
  });
  return root;
}

/* ============ editor: la hoja, las marcas y las notas al margen ============ */
function computeEcos(paras) {
  const toks = [];
  const stem = (f) => (f.replace(/(amente|imiento|aciones|ciones|cion|idades|idad|ismos|ismo|istas|ista|ando|iendo|aron|ieron|abamos|aban|abas|aba|ados|adas|idos|idas|ada|ado|ida|ido|ias|ian|ia|ar|er|ir|es|as|os|a|o|e|s)$/, '') || f).slice(0, 7);
  paras.forEach(p => {
    const text = parText(p); const re = /[\p{L}\p{N}]+/gu; let m;
    while ((m = re.exec(text))) {
      const f = fold(m[0]);
      if (f.length < 4 || STOP.has(f) || /^\d+$/.test(f)) continue;
      toks.push({ pid: p.id, s: m.index, e: m.index + m[0].length, k: stem(f) });
    }
  });
  const last = new Map(), hit = new Set();
  toks.forEach((t, i) => { const j = last.get(t.k); if (j != null && i - j <= 22) { hit.add(j); hit.add(i); } last.set(t.k, i); });
  return Array.from(hit).sort((a, b) => a - b).map(i => toks[i]);
}

  onBeforeInput(e) {

  onKeydown(e) {

  /* ---------- posiciones de cursor ---------- */
  paraOf(node) {

  pointOffset(pe, node, off) {

  pIndex(pid) { return this.cdoc.data.paras.findIndex(p => p.id === pid); },

  /* ---------- pintar ---------- */
  paraEl(p) {

  /* Pinta la hoja. Con «only» (ids de párrafos) repinta solo esos: en capítulos largos evita repintar todo tras cada revisión rápida. */

  visible(m) {

  /* ---------- leer lo que el navegador escribió ---------- */
  readDom() {
    const marks = new Map();
    allMarks(this.cdoc.data).forEach(x => marks.set(x.m.id, x.m));
    const used = new Set(), usedP = new Set(), out = [];
    const oldP = new Map(this.cdoc.data.paras.map(p => [p.id, p]));
    const isBlock = (n) => n.nodeType === 1 && /^(P|DIV|H[1-6]|LI|UL|OL|BLOCKQUOTE|SECTION|ARTICLE|PRE)$/.test(n.nodeName);

    const walk = (node, segs) => {
      node.childNodes.forEach(c => {

      const o = { id: id, segs: normSegs(segs) };

    let loose = null;
    const flush = () => { if (loose) { const segs = []; loose.forEach(n => { if (n.nodeType === 3) segs.push({ t: fix(n.nodeValue) }); else walk({ childNodes: [n] }, segs); }); const ns = normSegs(segs); if (ns.length) out.push({ id: uid('p'), segs: ns }); loose = null; } };
    this.root.childNodes.forEach(n => {

        flush();

          n.childNodes.forEach(c => { if (isBlock(c)) out.push(block(c)); else if (c.nodeType === 3) segsHere.push({ t: fix(c.nodeValue) }); });

    flush();
    if (!out.length) out.push({ id: (this.cdoc.data.paras[0] || {}).id || uid('p'), segs: [] });

  },
  isCanonical() {
    const marks = new Set(); allMarks(this.cdoc.data).forEach(x => marks.add(x.m.id));

  sync(type) {

    if (!RT.canWrite) { this.render(); return; }
    this.histTyping(before, type);
    this.firstEdit(before);
    const bm = new Map(before.map(p => [p.id, p]));
    after.forEach(p => { const b = bm.get(p.id); if (!b || !deq(b.segs, p.segs)) this.addDirty(p.id); });

  sizeCheck: debounce(function () {

  }, 3000),
  async splitChapter() {
    const c = this.lastCaret; if (!c) return;
    const i = this.pIndex(c.pid); if (i <= 0) { App.toast('Ubica el cursor en el párrafo donde debe empezar el nuevo ' + App.unit().toLowerCase() + '.'); return; }
    const title = await UI.prompt('Dividir ' + App.unit().toLowerCase(), 'Título del nuevo ' + App.unit().toLowerCase(), kindOf(App.P()).unit + ' ' + (App.chapterList().length + 1), 'Dividir');
    if (title == null) return;
    await Versions.saveVersion(this.cid, 'Antes de dividir');
    const rest = clone(this.cdoc.data.paras.slice(i));

    this.pushUndo();
    this.cdoc.update(d => { d.paras = d.paras.slice(0, i); }, { now: true, silent: true });
    App.chapters.create(ncid, { paras: rest });
    App.proj().update(x => { const k = x.chapters.findIndex(z => z.id === cid); x.chapters.splice(k + 1, 0, { id: ncid, title: title || App.unit() }); }, { now: true });
    App.toast('Listo: «' + (title || App.unit()) + '» quedó como ' + App.unit().toLowerCase() + ' aparte.', { action: { label: 'Ir', fn: () => App.go(App.chHash(ncid)) } });

  },
  afterChange() {

    if (window.Collab) Collab.caretSoon();
    if (App.focus) { this.markCurrent(); this.typewriter(); }
  },
  firstEdit(before) {

  },
  addDirty(pid) {

  onRemote() {
    if (!this.root) return;

  },

  /* ---------- operaciones de párrafo ---------- */
  /* Párrafo nuevo después del actual, con el contenido dado (segs). Devuelve su id. */
  insertParaAfter(segs, extra) {

    this.pushUndo();
    const np = Object.assign({ id: uid('p'), segs: segs }, extra || {});
    const cur = this.cdoc.data.paras[i];
    const empty = cur && !parText(cur).trim();
    this.cdoc.update(d => { if (empty) d.paras[i] = Object.assign({}, np, { id: cur.id }); else d.paras.splice(i + 1, 0, np); }, { silent: true });
    const id = empty ? cur.id : np.id;
    this.addDirty(id);
    this.render(); this.afterChange();
    return id;
  },
  /* Hueco «por escribir»: un párrafo marcado como pendiente para rellenar después. */
  insertGap() {
    const m = { id: uid('m'), type: 'pend', text: '[por escribir]', note: 'Hueco por rellenar. Escribe dentro de los corchetes qué va aquí, o reemplázalo por el texto cuando lo tengas.', by: RT.me || 'local', at: Date.now(), gap: true };
    const pid = this.insertParaAfter([{ m: m }]);

    // nuevo párrafo vacío después del hueco para seguir escribiendo
    const i = this.pIndex(pid);
    this.cdoc.update(d => { d.paras.splice(i + 1, 0, { id: uid('p'), segs: [] }); }, { silent: true });
    this.render();
    const nid = this.cdoc.data.paras[i + 1].id;
    this.root.focus(); this.setCaret({ pid: nid, off: 0 });
    App.toast('Hueco agregado. Aparece en «Ir a…» y en las notas como pendiente.', { id: 'gap' });
  },
  insertSep() {
    const pid = this.insertParaAfter([{ t: '* * *' }]);

    const i = this.pIndex(pid);
    this.cdoc.update(d => { d.paras.splice(i + 1, 0, { id: uid('p'), segs: [] }); }, { silent: true });
    this.render();

  },
  splitAtCaret() {

    this.cdoc.update(d => { d.paras[i] = Object.assign({}, p, { segs: L }); d.paras.splice(i + 1, 0, np); }, { silent: true });

  join(i) {
