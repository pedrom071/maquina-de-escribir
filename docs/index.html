  /* ---------- deshacer ---------- */
  H() { let x = this.hist.get(this.cid); if (!x) { x = { undo: [], redo: [], burst: false, kind: null, t: null }; this.hist.set(this.cid, x); } return x; },
  snapshot() { return { paras: clone(this.cdoc.data.paras), caret: this.getCaret() || this.lastCaret }; },
  pushUndo() { const x = this.H(); x.undo.push(this.snapshot()); if (x.undo.length > 300) x.undo.shift(); x.redo.length = 0; x.burst = false; },
  histTyping(before, type) {

  },

  /* ---------- selección: marcar a mano ---------- */
  onSelection() {

        else if (this.active && !this.editingNote && !this.replyTo) this.setActive(null, false, true);

  selbarSoon: debounce(function () { Editor.updateSelbar(); }, 160),
  updateSelbar() {
    const sel = getSelection();

    const c = this.getCaret(); if (!c) { this.hideSelbar(); return; }
    const one = !c.fpid || c.fpid === c.pid;
    const bar = $('#selbar'); bar.textContent = '';
    if (RT.canWrite && one) {
      ['rep', 'dud', 'coh', 'bien', 'ort', 'rec', 'pend'].forEach(t => bar.append(h('button', { class: 'tb ' + t, type: 'button', title: 'Marcar: ' + TYPES[t].l, 'aria-label': 'Marcar como ' + TYPES[t].l, text: TYPES[t].g, onclick: () => this.markSelection(t) })));
    } else if (RT.canWrite) bar.append(h('span', { class: 'msg', text: 'Para marcar, selecciona dentro de un párrafo.' }));
    if (window.Collab && Collab.canSendState) {
      if (bar.childNodes.length) bar.append(h('span', { class: 'sep' }));
      bar.append(h('button', { class: 'btn small ghost', type: 'button', title: 'Llevar este fragmento a tu conversación con Claude', onclick: () => Collab.sendSelection(sel.toString()) }, icon('chat'), 'Al chat'));
    }
    if (!bar.childNodes.length) { this.hideSelbar(); return; }
    bar.hidden = false;
    const r = sel.getRangeAt(0).getBoundingClientRect();
    const w = bar.offsetWidth, hh = bar.offsetHeight;
    if (r.bottom < 0 || r.top > window.innerHeight) { bar.hidden = true; return; }
    let top = r.top - hh - 10; if (top < 60) top = r.bottom + 10;
    top = Math.max(60, Math.min(top, window.innerHeight - hh - 40));

  },
  hideSelbar() { const b = $('#selbar'); if (b) b.hidden = true; },
  markSelection(type) {
    const c = this.getCaret(); if (!c) return;

    if (a > b) { const t = a; a = b; b = t; }
    const i = this.pIndex(pid); if (i < 0) return;
    const p = clone(this.cdoc.data.paras[i]);
    const txt = parText(p);
    while (a < b && /\s/.test(txt[a])) a++;

  coh: 'coh: contradicciones con la biblia o con lo ya escrito (fechas, edades, nombres, hechos, quién narra y qué sabe), o datos que conviene fijar.',
  bien: 'bien: algo que funciona especialmente bien y conviene conservar (úsalo con moderación).',
  ort: 'ort: errores de ortografía, tildes, concordancia o puntuación. Incluye "fix" con el fragmento ya corregido y nada más cambiado.',
  rec: 'rec: recursos de voz o estilo que conviene tener presentes (tono, ritmo, registro).'
};
const DENSITY = { pocas: 3, normal: 5, muchas: 8 };

const Review = {
  queue: [], running: null, timers: new Map(), chat: [], disabled: false,

  ok() {
    if (RT.web && !AI.ready()) { AI.open(); App.toast('Configura tu IA para usar esta revisión. La revisión rápida funciona sin IA.'); return false; }
    if (!RT.sample || this.disabled) { App.toast('La revisión con ' + AI.name() + ' no está disponible en esta vista.'); return false; }
    if (!RT.canWrite) { App.toast('Necesitas permiso de edición para revisar.'); return false; }
    return true;
  },
  statusText() {
    if (this.running) return this.running.label + (this.queue.length ? ' · ' + this.queue.length + ' en cola' : '');
    const n = Editor.cid ? (Editor.dirty.get(Editor.cid) || new Set()).size : 0;
    if (n && RT.sample) return (App.prefs.auto ? 'Revisión automática · ' : '') + plural(n, 'párrafo editado', 'párrafos editados');
    return '';
  },
  isReviewing(cid, pid) { return !!(this.running && this.running.cid === cid && (this.running.pid === pid || this.running.all)); },
  onMount() {},
  onEdit(cid, pid) {
    if (window.Checker) Checker.schedule(cid, pid);
    const aiAuto = RT.web ? (App.prefs.autoAI === true && AI.ready()) : App.prefs.auto;
    if (!aiAuto || !RT.sample || this.disabled || !RT.canWrite || App.ultra) return;
    clearTimeout(this.timers.get('auto'));
    this.timers.set('auto', setTimeout(() => {
      const d = App.ch(cid); if (!d || !d.data || Editor.composing) return;
      const dirty = Editor.dirty.get(cid); if (!dirty) return;
      const ids = [pid].concat(d.data.paras.map(p => p.id).filter(id => id !== pid && dirty.has(id)));
      ids.slice(0, 4).forEach(id => {
        const p = d.data.paras.find(x => x.id === id);
        if (p && countWords(parText(p)) >= 8) this.enqueue({ cid: cid, pid: id, force: false });
      });
    }, 4000));
  },
  reviewPara(cid, pid, force) {
    if (!this.ok() || !pid) return;
    clearTimeout(this.timers.get('auto'));
    this.enqueue({ cid: cid, pid: pid, force: !!force });
  },
  reviewDirty(cid) {
    if (!this.ok()) return;
    const s = Editor.dirty.get(cid) || new Set();
    if (!s.size) { App.toast('No hay párrafos editados sin revisar.'); return; }
    const d = App.ch(cid);
    const order = d && d.data ? d.data.paras.map(p => p.id).filter(id => s.has(id)) : Array.from(s);
    order.forEach(pid => this.enqueue({ cid: cid, pid: pid, force: false }));
  },
  enqueue(job) {
    if (this.queue.some(q => q.cid === job.cid && q.pid === job.pid)) return;
    if (this.running && this.running.cid === job.cid && this.running.pid === job.pid && !job.force) return;
    this.queue.push(job);
    App.renderStatus();
    this.pump();
  },
  async pump() {
    if (this.running) return;
    const job = this.queue.shift();
    if (!job) { App.renderStatus(); return; }
    const dirty = Editor.dirty.get(job.cid);
    if (!job.force && !(dirty && dirty.has(job.pid))) { this.pump(); return; }
    await this.runPara(job);
    this.pump();
  },
  afterMarks(cid) {
    if (Editor.root && Editor.cid === cid) { Editor.render(true); Editor.afterChange(); }
    App.renderSideSoon();
  },
  fail(e) {
    const c = e && e.code;
    if (c === 'cancelled') return;
    if (c === 'bad_key' || c === 'not_configured') { this.queue = []; App.toast(AI.explain(e)); AI.open(); return; }
    if (c === 'network' || (RT.web && c === 'invalid_request')) { this.queue = []; App.toast(AI.explain(e)); return; }
    if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') {
      this.disabled = true; this.queue = [];
      App.toast(AI.name(true) + ' no está disponible para revisar en esta vista.'); return;
    }
    if (c === 'rate_limited') { this.queue = []; App.toast('Muchas revisiones seguidas. Espera un momento y vuelve a intentar.'); return; }
    if (c === 'invalid_json') { App.toast('No pude leer la respuesta de ' + AI.name() + '. Intenta de nuevo.'); return; }
    if (c === 'prompt_too_large') { App.toast('El texto es demasiado largo para revisarlo de una vez.'); return; }
    App.toast('La revisión no se completó. Intenta de nuevo.');
  },
  integrate(P) { return !(P && P.review && P.review.integrate === false); },
  /* Marcas de la revisión automática que la IA puede confirmar o descartar. */
  autoObs(p, protectedIds, prefix) {
    const out = [];
    p.segs.forEach(s => { if (s.m && isStale(s.m, protectedIds, 'revisor')) out.push({ id: (prefix || '') + 'A' + (out.length + 1), m: s.m }); });
    return out;
  },
  obsLines(obs) {
    return obs.map(o => o.id + ' · ' + o.m.type + ' · «' + o.m.text + '» · ' + (o.m.note || '') + (o.m.fix && o.m.fix.to ? ' · corrección propuesta: «' + o.m.fix.to + '»' : '')).join('\n');
  },
  integrationRules() {
    return [
      'Antes que tú pasó una revisión automática por reglas (diccionario, puntuación, frases largas, ecos, muletillas). Sus observaciones vienen etiquetadas (A1, A2…). Son candidatas, no verdades:',
      '- Si una es correcta, inclúyela en tu lista con el campo "auto" igual a su etiqueta; puedes mejorar la nota, cambiar el tipo o corregir la propuesta en "fix".',
      '- Si es un falso positivo (nombre propio, chilenismo o palabra válida, repetición o estilo buscado por el autor, voz del narrador), simplemente no la incluyas: se descartará.',
      '- Agrega además lo que la revisión automática no ve (coherencia, ambigüedad, voz).',
      'Tu lista es la final y reemplaza a la automática.'
    ].join('\n');
  },
  /* Reemplaza las marcas viejas del párrafo por la lista consolidada y recuerda lo descartado. */
  applyList(x, pid, list, obs, P, protectedIds, integrate) {
    const k = x.paras.findIndex(z => z.id === pid); if (k < 0) return { added: 0, removed: 0 };
    const np = clone(x.paras[k]);
    const stale = (m) => isStale(m, protectedIds) || (integrate && isStale(m, protectedIds, 'revisor'));
    const removed = np.segs.filter(s => s.m && stale(s.m)).length;
    np.segs = normSegs(np.segs.map(s => (s.m && stale(s.m)) ? { t: s.m.text } : s));
    let added = 0; const used = new Set();
    list.forEach(it => {
      const ref = it && typeof it.auto === 'string' ? it.auto.trim().toUpperCase() : '';
      const o = ref ? obs.find(z => z.id.toUpperCase() === ref) : null;
      if (o) { used.add(o.id); if (!it.text) it.text = o.m.text; if (!it.type) it.type = o.m.type; if (it.fix == null && o.m.fix) it.fix = o.m.fix.to; }
      if (this.insert(np, it, P, o)) added++;
    });
    if (integrate && obs.length) {
      x.dismiss = x.dismiss || {};
      const prev = x.dismiss[pid] || [];
      const dis = obs.filter(o => !used.has(o.id)).map(o => ({ r: o.m.rule || '', t: o.m.text }));
      x.dismiss[pid] = prev.concat(dis).slice(-40);
      const words = obs.filter(o => !used.has(o.id) && o.m.rule === 'spell' && o.m.word).map(o => o.m.word);
      if (words.length) x.okWords = Array.from(new Set((x.okWords || []).concat(words))).slice(-300);
    }
    x.paras[k] = np;
    return { added: added, removed: removed };
  },
  allowed(P) { const t = (P.review && P.review.types) || ['rep', 'dud', 'coh', 'bien', 'ort', 'rec']; return t.filter(x => TYPE_RULES[x]); },
  baseRules(P) {
    const k = kindOf(P);
    return [
      'Eres corrector de continuidad y estilo de un texto en español (' + k.label.toLowerCase() + '). El autor escribe; tú solo señalas. No propongas tramas, escenas, argumentos, giros ni reescrituras de estilo.',
      'Instrucciones del autor: ' + (P.guide || k.guide),
      'Tipos de marca permitidos:',
      this.allowed(P).map(t => '- ' + TYPE_RULES[t]).join('\n'),
      'Cada nota: máximo 30 palabras, en español de Chile, tono sobrio y concreto. Cada "text" debe copiar un fragmento LITERAL y exacto del texto (máximo 14 palabras), sin comillas añadidas.'
    ].join('\n');
  },
  async runPara(job) {
    const d = App.ch(job.cid); const P = App.P();
    if (!d || !d.data || !P || !RT.sample) return;
    const p = d.data.paras.find(x => x.id === job.pid);
    if (!p) return;
    const full = parText(p);
    if (!full.trim()) { const s = Editor.dirty.get(job.cid); if (s) s.delete(job.pid); return; }
    const i = d.data.paras.indexOf(p);
    const prev = d.data.paras.slice(Math.max(0, i - 3), i).map(parText).join('\n\n').slice(-1800);
    const next = d.data.paras.slice(i + 1, i + 2).map(parText).join('\n\n').slice(0, 700);
    const protectedIds = protectedMarkIds(P);
    const integ = this.integrate(P);
    const obs = integ ? this.autoObs(p, protectedIds) : [];
    const kept = p.segs.filter(s => s.m && !isStale(s.m, protectedIds) && !(integ && isStale(s.m, protectedIds, 'revisor'))).map(s => s.m.text);
    const maxN = (DENSITY[(P.review && P.review.density) || 'normal'] || 5) + obs.length;
    const bible = bibleDigest(P, 3500);
    const prompt = [
      this.baseRules(P),
      'Revisa SOLO el párrafo indicado. Como máximo ' + maxN + ' marcas. No repitas estos fragmentos ya marcados por el autor u otras personas: ' + JSON.stringify(kept) + '.',
      obs.length ? this.integrationRules() + '\nObservaciones automáticas:\n' + this.obsLines(obs) : '',
      'Responde solo con un arreglo JSON, por ejemplo: [{"type":"rep","text":"fragmento exacto","note":"nota breve"},{"type":"ort","text":"ordena","note":"Falta una sílaba.","fix":"ordenada","auto":"A1"}]. Si no hay nada que marcar, responde [].',
      bible ? '\nBiblia del proyecto (lo ya decidido):\n' + bible : '',
      '\nTexto anterior (contexto):\n' + (prev || '(inicio)'),
      next ? '\nTexto siguiente (contexto):\n' + next : '',
      '\nPÁRRAFO A REVISAR:\n' + full
    ].join('\n');
    this.running = { cid: job.cid, pid: job.pid, label: 'Revisando párrafo ' + (i + 1) + '…' };
    App.renderStatus(); if (Editor.cid === job.cid) Editor.decorate();
    try {
      const res = await RT.sample.json(prompt, { modelTier: 'default' });
      const list = Array.isArray(res) ? res : (res && Array.isArray(res.marcas) ? res.marcas : []);
      const cur = d.data.paras.find(x => x.id === job.pid);
      let added = 0, removed = 0;
      if (cur) {
        const changedMeanwhile = parText(cur) !== full;
        d.update(x => { const r = this.applyList(x, job.pid, list.slice(0, maxN), obs, P, protectedIds, integ); added = r.added; removed = r.removed; }, { silent: true });
        if (!changedMeanwhile) { const s = Editor.dirty.get(job.cid); if (s) s.delete(job.pid); }
      }
      this.running = null;
      this.afterMarks(job.cid);
      if (job.force) App.toast('Párrafo ' + (i + 1) + ' revisado: ' + (added ? plural(added, 'marca nueva', 'marcas nuevas') : 'sin observaciones nuevas') + (removed ? '. Reemplacé ' + plural(removed, 'marca anterior', 'marcas anteriores') : '') + '.');
    } catch (e) {
      this.running = null;
      this.afterMarks(job.cid);
      this.fail(e);
    }
    App.renderStatus();
  },
  insert(p, it, P, fromAuto) {
    if (!it || typeof it !== 'object') return false;
    const type = String(it.type || '');
    if (!TYPE_RULES[type] || !this.allowed(P).includes(type)) return false;
    let text = typeof it.text === 'string' ? it.text.replace(/^["«“]|["»”]$/g, '') : '';
    if (text.length < 2) return false;
    const note = typeof it.note === 'string' ? it.note.trim().slice(0, 600) : '';
    const m = { id: uid('m'), type: type, text: '', note: note, by: 'claude', at: Date.now() };
    const fix = typeof it.fix === 'string' ? it.fix : '';
    if ((type === 'ort' || fromAuto) && fix && fix !== text) m.fix = { from: text, to: fix, applied: false };
    if (fromAuto) { m.src = 'auto'; if (fromAuto.m.rule) m.rule = fromAuto.m.rule; if (fromAuto.m.word) m.word = fromAuto.m.word; }
    if (insertMarkByText(p, text, m)) return true;
    const t2 = text.trim();
    if (t2 !== text && t2.length > 1) { if (m.fix) m.fix.from = t2; return insertMarkByText(p, t2, m); }
    return false;
  },

  /* revisión completa del capítulo, en una o pocas llamadas */
  async reviewChapter(cid) {
    if (!this.ok()) return;
    if (this.running) { App.toast('Espera a que termine la revisión en curso.'); return; }
    const d = App.ch(cid), P = App.P(); if (!d || !d.data) return;
    const paras = d.data.paras.filter(p => parText(p).trim());
    if (!paras.length) { App.toast('No hay texto que revisar.'); return; }
    const chunks = []; let cur = [], size = 0;
    paras.forEach(p => { const t = parText(p); if (size + t.length > 40000 && cur.length) { chunks.push(cur); cur = []; size = 0; } cur.push(p); size += t.length; });
    if (cur.length) chunks.push(cur);
    const dens = (P.review && P.review.density) || 'normal';
    const per = { pocas: 0.8, normal: 1.6, muchas: 3 }[dens] || 1.6;
    const protectedIds = protectedMarkIds(P);
    const bible = bibleDigest(P, 5000);
    let added = 0, removed = 0;
    this.running = { cid: cid, all: true, label: 'Revisando el ' + App.unit().toLowerCase() + '…' };
    App.renderStatus(); if (Editor.cid === cid) Editor.decorate();
    if (Editor.cid === cid) Editor.pushUndo();
    try {
      for (let ci = 0; ci < chunks.length; ci++) {
        const ch = chunks[ci];
        const labels = new Map(); ch.forEach((p, i) => labels.set('P' + (i + 1), p.id));
        const integ = this.integrate(P);
        const obsBy = new Map(); let nObs = 0;
        if (integ) ch.forEach((p, i) => { const o = this.autoObs(p, protectedIds, 'P' + (i + 1) + '.'); if (o.length) { obsBy.set(p.id, o); nObs += o.length; } });
        const body = ch.map((p, i) => '[P' + (i + 1) + '] ' + parText(p) + (obsBy.has(p.id) ? '\n  Observaciones automáticas:\n  ' + this.obsLines(obsBy.get(p.id)).replace(/\n/g, '\n  ') : '')).join('\n\n');
        const maxT = Math.min(160, Math.max(4, Math.round(ch.length * per)) + nObs);
        const prompt = [
          this.baseRules(P),
          'Revisa todo el texto siguiente, párrafo por párrafo. Como máximo ' + maxT + ' marcas en total, priorizando lo más importante. Indica en "p" la etiqueta del párrafo.',
          nObs ? this.integrationRules() + '\nLas etiquetas de las observaciones automáticas llevan el párrafo delante (P3.A1).' : '',
          'Responde solo con un arreglo JSON, por ejemplo: [{"p":"P3","type":"coh","text":"fragmento exacto","note":"nota breve"},{"p":"P5","type":"ort","text":"queria","note":"Falta la tilde.","fix":"quería","auto":"P5.A1"}]. Si no hay nada, responde [].',
          bible ? '\nBiblia del proyecto:\n' + bible : '',
          '\nTEXTO (' + (App.chTitle(cid) || App.unit()) + (chunks.length > 1 ? ', parte ' + (ci + 1) + ' de ' + chunks.length : '') + '):\n' + body
        ].join('\n');
        this.running.label = 'Revisando el ' + App.unit().toLowerCase() + (chunks.length > 1 ? ' (' + (ci + 1) + '/' + chunks.length + ')' : '') + '…';
        App.renderStatus();
        const res = await RT.sample.json(prompt, { modelTier: 'default' });
        const list = Array.isArray(res) ? res : [];
        const byPid = new Map();
        list.forEach(it => { const pid = it && labels.get(String(it.p || '').trim().toUpperCase()); if (pid) { if (!byPid.has(pid)) byPid.set(pid, []); byPid.get(pid).push(it); } });
        d.update(x => {
          ch.forEach(op => {
            const r = this.applyList(x, op.id, byPid.get(op.id) || [], obsBy.get(op.id) || [], P, protectedIds, integ);
            added += r.added; removed += r.removed;
          });
        }, { silent: true });
        this.afterMarks(cid);
      }
      const s = Editor.dirty.get(cid); if (s) s.clear();
      App.toast(App.unit() + ' revisado: ' + plural(added, 'marca', 'marcas') + (removed ? ' (reemplazó ' + removed + ' anteriores)' : '') + '.');
    } catch (e) { this.fail(e); }
    this.running = null;
    this.afterMarks(cid);
    App.renderStatus();
  },

  /* informe del capítulo */
  report(cid) {
    const d = App.ch(cid); if (!d || !d.data) return;
    const body = h('div', { style: 'display:flex;flex-direction:column;gap:.6rem' });
    const out = h('div', { id: 'report-out' });
    const meta = h('p', { class: 'muted', style: 'margin:0;font-size:.7812rem' });
    const show = () => {
      out.textContent = '';
      const r = d.data.report;
      if (r && r.text) { out.append(renderProse(r.text)); meta.textContent = 'Generado ' + relTime(r.at) + (r.by && r.by !== RT.me ? ' por ' + Collab.name(r.by) : '') + '.'; }
      else { out.append(h('p', { class: 'muted', text: 'Todavía no hay un informe de este ' + App.unit().toLowerCase() + '. El informe resume, revisa coherencia con la biblia y con lo anterior, y señala ritmo, muletillas y preguntas abiertas, sin reescribir nada.' })); meta.textContent = ''; }
    };
    show();
    body.append(meta, out);
    const gen = btn('Generar informe', () => this.genReport(cid, out, meta, gen), 'primary');
    if (!RT.sample || !RT.canWrite) gen.disabled = true;
    UI.drawer({ title: 'Informe', key: 'report', body: body, foot: gen });
  },
  async genReport(cid, out, meta, gen) {
    if (!this.ok()) return;
    const d = App.ch(cid), P = App.P();
    const text = d.data.paras.map(parText).filter(Boolean).join('\n\n');
    if (!text.trim()) { App.toast('No hay texto para el informe.'); return; }
    const before = projectText(P, 30000, null);
    const prompt = [
      'Eres corrector editorial de un texto en español (' + kindOf(P).label.toLowerCase() + '). No reescribas ni propongas tramas, escenas o argumentos: solo observa.',
      'Instrucciones del autor: ' + (P.guide || kindOf(P).guide),
      'Escribe un informe breve en español de Chile con estos apartados (usa "## " para cada título y viñetas "- "):',
      '## Qué pasa (3 líneas, sin juzgar)', '## Coherencia (contradicciones con la biblia o con lo anterior; datos que conviene fijar)', '## Ritmo y estructura', '## Repeticiones y muletillas', '## Preguntas abiertas para el autor',
      'Sé concreto y cita fragmentos breves entre «». Máximo 350 palabras.',
      '\nBiblia del proyecto:\n' + (bibleDigest(P, 5000) || '(vacía)'),
      '\nResto del proyecto (contexto):\n' + before.slice(-30000),
      '\nTEXTO A INFORMAR («' + App.chTitle(cid) + '»):\n' + text.slice(0, 80000)
    ].join('\n');
    gen.disabled = true; out.textContent = ''; const live = h('div', { class: 'bubble', text: 'Pensando…' }); out.append(live);
    try {
      const r = await RT.sample(prompt, { onText: ({ text }) => { live.textContent = text; }, modelTier: 'default', cache: false });
      d.update(x => { x.report = { at: Date.now(), by: RT.me || 'local', text: r.text }; }, { now: true });
      out.textContent = ''; out.append(renderProse(r.text)); meta.textContent = 'Generado recién.';
    } catch (e) { live.textContent = e && e.text ? e.text : ''; this.fail(e); }
    gen.disabled = false;
  },

  /* extraer datos a la biblia */
  async extract(cid) {
    if (!this.ok()) return;
    const d = App.ch(cid), P = App.P();
    const text = d.data.paras.map(parText).filter(Boolean).join('\n\n');
    if (!text.trim()) { App.toast('No hay texto para extraer.'); return; }
    const body = h('div', { style: 'display:flex;flex-direction:column;gap:.6rem' }, h('div', { class: 'bubble', text: 'Leyendo el ' + App.unit().toLowerCase() + ' y comparando con la biblia…' }));
    const foot = h('div', { class: 'row', style: 'width:100%' });
    UI.drawer({ title: 'Extraer a la biblia', key: 'extract', body: body, foot: foot });
    const fiction = kindOf(P).timeline;
    const prompt = [
      'Extrae datos FACTUALES que el texto establece (no inventes ni interpretes; no propongas nada creativo). Compara con la biblia y devuelve solo lo nuevo o lo que la complementa.',
      fiction
        ? 'Responde solo con JSON: {"personajes":[{"nombre":"","datos":["dato breve"]}],"lugares":[{"nombre":"","datos":[""]}],"hechos":[{"titulo":"","cuando":"momento según el texto","nota":""}],"cabos":[{"titulo":"pregunta o promesa abierta","detalle":""}]}'
        : 'Responde solo con JSON: {"ideas":[{"nombre":"idea o tesis","datos":[""]}],"fuentes":[{"nombre":"autor o fuente citada","datos":[""]}],"datos":[{"nombre":"dato o cifra","datos":["fuente si se menciona"]}],"cabos":[{"titulo":"afirmación que necesita respaldo","detalle":""}]}',
      'Máximo 8 elementos por lista. Datos de máximo 15 palabras.',
      '\nBiblia actual:\n' + (bibleDigest(P, 6000) || '(vacía)'),
      '\nTEXTO («' + App.chTitle(cid) + '»):\n' + text.slice(0, 90000)
    ].join('\n');
    let res;
    try { res = await RT.sample.json(prompt, { modelTier: 'default' }); }
    catch (e) { body.textContent = ''; body.append(h('p', { class: 'muted', text: 'No se pudo extraer.' })); this.fail(e); return; }
    if (!UI.drawerOpen('extract')) return;
    body.textContent = '';
    const props = [];
    const group = (title, arr, kind) => {
      if (!Array.isArray(arr) || !arr.length) return;

/* ============ historial de versiones por capítulo ============ */
function lcsPairs(a, b, eq) {
  const n = a.length, m = b.length;
  if (n * m > 400000) return null;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = eq(a[i], b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (eq(a[i], b[j])) { out.push(['=', a[i], b[j]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push(['-', a[i], null]); i++; }
    else { out.push(['+', null, b[j]]); j++; }
  }
  while (i < n) out.push(['-', a[i++], null]);
  while (j < m) out.push(['+', null, b[j++]]);
  return out;
}
function wordDiff(oldT, newT, el) {
  const A = oldT.split(/(\s+)/), B = newT.split(/(\s+)/);
  const pairs = lcsPairs(A, B, (x, y) => x === y);
  if (!pairs) { el.append(h('del', { text: oldT }), ' ', h('ins', { text: newT })); return; }
  pairs.forEach(([k, x, y]) => {
    if (k === '=') el.append(x);
    else if (k === '-') el.append(h('del', { text: x, style: 'color:var(--bad)' }));
    else el.append(h('ins', { text: y, style: 'color:var(--ok);text-decoration:none;background:var(--bien-bg)' }));
  });
}

function lev(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 2;
  const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}

const NUM_WORDS = {

  once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19,
  veinte: 20, veintiun: 21, veintiuno: 21, veintiuna: 21, veintidos: 22, veintitres: 23, veinticuatro: 24, veinticinco: 25,
  veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29, treinta: 30, cuarenta: 40, cincuenta: 50,
  sesenta: 60, setenta: 70, ochenta: 80, noventa: 90, cien: 100, ciento: 100, medio: 0.5, media: 0.5

/* Convierte «42», «cuarenta y dos» o «veintisiete» en número. */
function parseNum(s) {
  if (!s) return null;
  const t = fold(s.trim());
  if (/^\d+([.,]\d+)?$/.test(t)) return parseFloat(t.replace(',', '.'));
  const parts = t.split(/\s+y\s+|\s+/).filter(Boolean);
  let n = 0;
  for (const p of parts) { if (!(p in NUM_WORDS)) return null; n += NUM_WORDS[p]; }

};

/* ============ diálogos: atajos para la raya y revisión a pedido (normas de la RAE) ============ */
const DLG_VERBS = ['dijo', 'dije', 'preguntó', 'pregunté', 'respondió', 'respondí', 'contestó', 'contesté', 'murmuró', 'susurró', 'gritó', 'exclamó', 'añadió', 'agregó', 'repitió', 'comentó', 'insistió', 'explicó', 'replicó', 'pensó', 'suspiró', 'sonrió', 'interrumpió', 'continuó', 'siguió', 'aclaró', 'admitió', 'advirtió', 'ordenó', 'pidió', 'propuso', 'protestó', 'reconoció', 'recordó', 'se rió', 'rio', 'rió', 'masculló', 'balbuceó', 'tartamudeó', 'mintió', 'confesó', 'concluyó', 'dice', 'pregunta', 'responde', 'contesta', 'murmura', 'grita'];
const DLG_VERB_RE = new RegExp('^(' + DLG_VERBS.map(escRe).join('|') + ')(?![\\p{L}])', 'iu');

const Dialogo = {
  /* ---------- atajos ---------- */
  caretPara() {
    const c = Editor.getCaret() || Editor.lastCaret; if (!c || !Editor.cdoc) return null;
    const p = Editor.cdoc.data.paras.find(x => x.id === c.pid); if (!p) return null;
    return { c: c, p: p, t: parText(p) };
  },
  /* Alt + guion: empieza una línea de diálogo con raya (en el párrafo vacío o en uno nuevo). */
  open() {
    if (!RT.canWrite || !Editor.root) return;
    const x = this.caretPara(); if (!x) { Editor.root.focus(); return; }
    Editor.root.focus();
    if (!x.t.trim()) { Editor.setCaret({ pid: x.p.id, off: 0 }); document.execCommand('insertText', false, '—'); return; }
    if (x.c.off === 0 && !/^\s*—/.test(x.t)) { Editor.setCaret({ pid: x.p.id, off: 0 }); document.execCommand('insertText', false, '—'); return; }
    Editor.setCaret({ pid: x.p.id, off: x.t.length });
    Editor.splitAtCaret();
    document.execCommand('insertText', false, '—');
  },
  /* Alt+I: abre o cierra el inciso del narrador según dónde estés (« —dijo» … «—»). */
  inciso() {
    if (!RT.canWrite || !Editor.root) return;
    const x = this.caretPara(); if (!x) return;
    Editor.root.focus();
    const before = x.t.slice(0, x.c.off);
    let n = (before.match(/—/g) || []).length;
    if (/^\s*—/.test(x.t)) n--;
    if (n % 2 === 0) document.execCommand('insertText', false, (!before || /\s$/.test(before) ? '' : ' ') + '—');
    else {
      if (/ $/.test(before)) document.execCommand('delete');
      document.execCommand('insertText', false, '—');
    }
  },
  /* ---------- revisión ---------- */
  /* Devuelve observaciones {type, rule, text, note, fix} para un párrafo. Solo señala. */
  analyze(t) {
    const out = [];
    const add = (text, note, fix) => { if (text && t.indexOf(text) >= 0 && !out.some(o => o.text === text)) out.push({ type: 'ort', rule: 'dlg', text: text, note: note + ' Si es un estilo buscado, ignóralo.', fix: fix }); };
    const isDlg = /^\s*[—–-]/.test(t);
    // guion o semiraya en lugar de raya (al abrir ya lo marca la revisión rápida)
    if (isDlg) { const re = /(\S)\s[-–]\s?([\p{Ll}])/gu; let m; while ((m = re.exec(t))) add(m[0], 'En los incisos del narrador va raya (—), no guion.', m[1] + ' —' + m[2]); }
    // solo se revisan los párrafos de diálogo (los que empiezan con raya)
    if (!isDlg || !/—/.test(t)) return out;
    // raya que abre el diálogo seguida de espacio
    let m = /^\s*(— +)([\p{L}¿¡«]+)/u.exec(t);
    if (m) add(m[1] + m[2], 'Tras la raya que abre el diálogo no va espacio.', '—' + m[2]);
    // rayas de inciso: se alternan apertura y cierre
    const pos = []; for (let i = 0; i < t.length; i++) if (t[i] === '—') pos.push(i);
    const opener = /^\s*—/.test(t) ? pos.shift() : null;
    const word = (i, dir) => { if (dir < 0) { const s = t.slice(0, i); const w = s.match(/(\S+)\s*$/); return w ? w[0] : ''; } const s = t.slice(i + 1); const w = s.match(/^\s*\S+/); return w ? w[0] : ''; };
    pos.forEach((i, k) => {
      const opening = k % 2 === 0;
      const prev = t[i - 1] || '', next = t[i + 1] || '';
      const ctx = word(i, -1) + '—' + word(i, 1);
      if (opening) {
        const last = k === pos.length - 1;
        if (prev && !/\s/.test(prev) && !/[(«"“]/.test(prev)) add(ctx, 'Falta un espacio antes de la raya que abre el inciso.', word(i, -1) + ' —' + word(i, 1));
        else if (/\s/.test(next)) add(word(i, -1) + '—' + word(i, 1), 'Sobra el espacio después de la raya que abre el inciso.', word(i, -1) + '—' + word(i, 1).trimStart());
        const after = t.slice(i + 1).replace(/^\s+/, '');
        const vm = DLG_VERB_RE.exec(after);
        if (vm && /^\p{Lu}/u.test(vm[1])) add('—' + vm[1], 'El verbo del inciso («' + vm[1].toLowerCase() + '») va en minúscula.', '—' + vm[1].toLowerCase());
        const pb = t.slice(0, i).replace(/\s+$/, '');
        const seg = vm ? t.slice(pb.length - 1, i + 1 + (t.slice(i + 1).match(/^\s*/)[0].length) + vm[1].length) : '';
        if (vm && /[,;:]$/.test(pb)) add(seg, 'El signo («' + pb.slice(-1) + '») va después del inciso, tras la raya de cierre: «… —' + vm[1].toLowerCase() + '—' + pb.slice(-1) + '».', '');
        else if (vm && /[^.]\.$/.test(pb)) add(seg, 'Antes de un inciso con verbo de habla no va punto: el punto va después del inciso.', '');
        void last;
      } else {
        if (/\s/.test(prev)) add(word(i, -1) + ' —', 'Sobra el espacio antes de la raya que cierra el inciso.', word(i, -1) + '—');
        const rest = t.slice(i + 1);
        if (/^[\s.…]*$/.test(rest)) add(word(i, -1).replace(/—$/, '') + '—' + rest.trim(), 'Si el inciso termina el párrafo, no se cierra con raya.', word(i, -1).replace(/—$/, '') + (rest.trim() || ''));
        else if (/^[\p{L}¿¡]/u.test(rest)) add(ctx, 'Falta un espacio (o un signo) después de la raya que cierra el inciso.', word(i, -1) + '— ' + word(i, 1));
      }
    });
    return out;
  },
  async check(cid) {
    cid = cid || App.cid;
    const d = App.ch(cid); if (!d || !d.data || !RT.canWrite) return;
    const P = App.P(); const protectedIds = protectedMarkIds(P);
    const res = new Map();
    d.data.paras.forEach(p => { const t = parText(p); res.set(p.id, { text: t, items: this.analyze(t) }); });
    let added = 0;
    Editor.pushUndo && Editor.cid === cid && Editor.pushUndo();
    d.update(x => {
      x.paras.forEach((p, k) => {
        const r = res.get(p.id); if (!r || parText(p) !== r.text) return;
        const np = clone(p);
        np.segs = normSegs(np.segs.map(s => (s.m && s.m.rule === 'dlg' && isStale(s.m, protectedIds, 'revisor')) ? { t: s.m.text } : s));
        r.items.forEach(it => { if (Checker.insert(np, it)) added++; });
        x.paras[k] = np;
      });
    }, { silent: true });
    if (Editor.root && Editor.cid === cid) { Editor.render(true); Editor.afterChange(); }
    const dlgParas = d.data.paras.filter(p => /^\s*[—–-]/.test(parText(p))).length;
    App.toast(added ? plural(added, 'detalle', 'detalles') + ' en los diálogos.' : (dlgParas ? 'Los diálogos siguen las normas de la raya.' : 'No encontré diálogos con raya en este ' + App.unit().toLowerCase() + '.'));
    return added;
  },
  help() {
    const ex = (a, b) => h('div', { class: 'dlg-ex' }, h('span', { class: 'k', text: a }), h('span', { text: b }));
    UI.modal({ title: 'Diálogos con raya', body: h('div', { class: 'dlg-help' },
      h('p', { class: 'muted', text: 'Atajos que solo insertan la raya; no cambian lo que escribes. La revisión de diálogos es a pedido y solo señala.' }),
      h('div', { class: 'dlg-keys' },
        ex(keys('alt', '-'), 'Abre una línea de diálogo: pone la raya al inicio del párrafo (o en uno nuevo).'),
        ex(keys('alt', 'I'), 'Inciso del narrador: la primera vez abre « —», la segunda lo cierra «—».')),
      h('h4', { text: 'Normas básicas (RAE)' }),
      ex('—Hola.', 'La raya de apertura va pegada a la palabra, sin espacio.'),
      ex('—Hola —dijo Ana—. ¿Vienes?', 'El inciso se abre con espacio antes y se cierra sin espacio; el punto va después de la raya de cierre.'),
      ex('—Ya voy —dijo.', 'Si el inciso termina el párrafo, no se cierra con raya.'),
      ex('—¿Vienes? —preguntó.', 'Tras ? o ! no se agrega punto; el verbo del inciso va en minúscula.'),
      ex('—Pasa —dijo Ana, y abrió la puerta.', 'Lo que sigue en el inciso es parte de él hasta la raya de cierre o el fin del párrafo.')),
      buttons: [{ label: 'Revisar diálogos de este ' + App.unit().toLowerCase(), cls: 'primary', onClick: () => { this.check(); } }, { label: 'Cerrar' }] });
  }
};
window.Dialogo = Dialogo;

/* ============ partes, carpetas y juntar proyectos ============
   - Partes: separadores dentro de un proyecto que agrupan capítulos o poemas (como carpetas).
   - Carpetas: ordenan los proyectos en el inicio.
   - Juntar: une varios proyectos (por ejemplo, poemas sueltos) en un libro, o mueve y copia capítulos entre proyectos. */
const ROMAN = (n) => { const r = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; r.forEach(([v, l]) => { while (n >= v) { s += l; n -= v; } }); return s; };

const Collections = {
  /* ---------- partes dentro de un proyecto ---------- */
  isPart(c) { return !!(c && c.role === 'parte'); },
  partNumber(cid) { let n = 0, out = null; App.chapterList().forEach(c => { if (this.isPart(c)) { n++; if (c.id === cid) out = n; } }); return out; },
  partLabel(c) { return 'Parte ' + ROMAN(this.partNumber(c.id) || 1); },
  /* Capítulos de cada parte: desde la parte hasta la siguiente parte o las secciones finales. */
  partOf(cid) {
    let cur = null;
    for (const c of App.chapterList()) {
      if (this.isPart(c)) cur = c;
      else if (Pages.role(c) && !SPECIAL[c.role].front) cur = null;
      if (c.id === cid) return this.isPart(c) ? null : cur;
    }
    return null;
  },
  children(pid) {
    const list = App.chapterList(); const i = list.findIndex(c => c.id === pid); const out = [];
    for (let j = i + 1; j < list.length; j++) { const c = list[j]; if (this.isPart(c) || (Pages.role(c) && !SPECIAL[c.role].front)) break; out.push(c); }
    return out;
  },
  addPart(afterCid) {
    const pd = App.proj(); if (!pd) return;
    const cid = uid('c');
    App.chapters.create(cid, { paras: [{ id: uid('p'), segs: [] }] });
    pd.update(x => {
      const n = x.chapters.filter(c => c.role === 'parte').length + 1;
      let i;
      if (afterCid) { i = x.chapters.findIndex(c => c.id === afterCid) + 1; }
      else { i = x.chapters.length; while (i > 0 && x.chapters[i - 1].role && SPECIAL[x.chapters[i - 1].role] && !SPECIAL[x.chapters[i - 1].role].front) i--; }
      x.chapters.splice(i, 0, { id: cid, title: 'Parte ' + ROMAN(n), role: 'parte' });
    }, { now: true });
    App.go(App.chHash(cid));
    setTimeout(() => { const t = $('.ch-title'); if (t) { t.focus(); t.select(); } }, 120);
  },
  /* Mueve un capítulo al final de una parte (o fuera de toda parte). */
  moveToPart(cid, partId) {
    App.proj().update(x => {
      const a = x.chapters; const i = a.findIndex(c => c.id === cid); if (i < 0) return;
      const [c] = a.splice(i, 1);
      let j;
      if (partId) {
        j = a.findIndex(z => z.id === partId) + 1;
        while (j < a.length && a[j].role !== 'parte' && !(a[j].role && SPECIAL[a[j].role] && !SPECIAL[a[j].role].front)) j++;
      } else {
        // fuera de las partes: antes de la primera parte
        j = a.findIndex(z => z.role === 'parte'); if (j < 0) j = a.length;
      }
      a.splice(j, 0, c);
    }, { now: true });
  },
  partMenu(anchor, cid) {
    const parts = App.chapterList().filter(c => this.isPart(c));
    const cur = this.partOf(cid);
    UI.menu(anchor, [{ label: 'Sin parte (al comienzo)', checked: !cur, onClick: () => this.moveToPart(cid, null) }, { sep: true }]
      .concat(parts.map(p => ({ label: this.partLabel(p) + (p.title && p.title !== this.partLabel(p) ? ': ' + p.title : ''), checked: cur && cur.id === p.id, onClick: () => this.moveToPart(cid, p.id) })))
      .concat([{ sep: true }, { label: 'Nueva parte…', onClick: () => this.addPart() }]));
  },
  toggleCollapse(pid) {
    App.prefs.collapsed = App.prefs.collapsed || {};
    if (App.prefs.collapsed[pid]) delete App.prefs.collapsed[pid]; else App.prefs.collapsed[pid] = true;
    App.savePrefs(); App.renderSide();
  },
  collapsed(pid) { return !!(App.prefs.collapsed && App.prefs.collapsed[pid]); },

  /* ---------- carpetas en el inicio ---------- */
  folders() {
    const set = new Set((App.prefs.folders || []).filter(Boolean));
    App.allProjects().forEach(x => { if (!x.doc.data.trashed && x.doc.data.folder) set.add(x.doc.data.folder); });
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'es'));
  },
  setFolder(d, name) {
    d.update(x => { if (name) x.folder = name; else delete x.folder; }, { now: true });
    if (name) { const f = App.prefs.folders || []; if (!f.includes(name)) { f.push(name); App.prefs.folders = f; App.savePrefs(); } }
    App.renderHomeSoon();
  },
  async newFolder(d) {
    const name = await UI.prompt('Nueva carpeta', 'Nombre de la carpeta', ''); if (!name || !name.trim()) return;
    const n = name.trim();
    const f = App.prefs.folders || []; if (!f.includes(n)) { f.push(n); App.prefs.folders = f; App.savePrefs(); }
    if (d) this.setFolder(d, n);
    else {
      App.prefs.homeFolder = n; App.savePrefs(); App.renderHomeSoon();
      App.toast('Carpeta «' + n + '» creada. Lleva proyectos a ella desde su menú «⋯ → Carpeta».');
    }
  },
  folderMenu(anchor, d) {
    const cur = d.data.folder || null;
    UI.menu(anchor, [{ label: 'Sin carpeta', checked: !cur, onClick: () => this.setFolder(d, null) }, { sep: true }]
      .concat(this.folders().map(f => ({ label: f, checked: cur === f, onClick: () => this.setFolder(d, f) })))
      .concat([{ sep: true }, { label: 'Nueva carpeta…', onClick: () => this.newFolder(d) }]));
  },
  async renameFolder(old) {
    const name = await UI.prompt('Renombrar carpeta', 'Nombre', old); if (!name || !name.trim() || name.trim() === old) return;
    const n = name.trim();
    App.allProjects().forEach(x => { if (x.doc.data.folder === old) x.doc.update(z => { z.folder = n; }, { now: true }); });
    App.prefs.folders = (App.prefs.folders || []).map(f => f === old ? n : f); if (App.prefs.homeFolder === old) App.prefs.homeFolder = n; App.savePrefs();
    App.renderHomeSoon();
  },
  async deleteFolder(name) {
    if (!await UI.confirm('Quitar carpeta', 'Los proyectos de «' + name + '» quedarán sin carpeta. No se borra ningún texto.', 'Quitar carpeta')) return;
    App.allProjects().forEach(x => { if (x.doc.data.folder === name) x.doc.update(z => { delete z.folder; }, { now: true }); });
    App.prefs.folders = (App.prefs.folders || []).filter(f => f !== name); if (App.prefs.homeFolder === name) App.prefs.homeFolder = null; App.savePrefs();
    App.renderHomeSoon();
  },
  /* Barra de carpetas del inicio. */
  folderBar(list) {
    const fs = this.folders();
    if (!fs.length && (!RT.canWrite || !list.length)) return null;
    const cur = App.prefs.homeFolder && fs.includes(App.prefs.homeFolder) ? App.prefs.homeFolder : null;
    const bar = h('div', { class: 'fbar', role: 'tablist', 'aria-label': 'Carpetas' });
    const chip = (label, val, n) => h('button', { type: 'button', role: 'tab', class: 'fchip' + (cur === val ? ' on' : ''), 'aria-selected': cur === val ? 'true' : 'false', onclick: () => { App.prefs.homeFolder = val; App.savePrefs(); App.renderHomeSoon(); } }, icon(val ? 'folder' : 'grid'), h('span', { text: label }), h('b', { text: String(n) }));
    if (fs.length) bar.append(chip('Todos', null, list.length));
    fs.forEach(f => bar.append(chip(f, f, list.filter(x => x.doc.data.folder === f).length)));
    if (RT.canWrite) bar.append(h('button', { type: 'button', class: 'fchip add', title: 'Agrupa proyectos en una carpeta (por ejemplo, poemas sueltos para un poemario)', onclick: () => this.newFolder(null) }, icon('folder'), h('span', { text: 'Crear carpeta' })));
    if (!fs.length) bar.append(h('span', { class: 'fbar-hint', text: 'Agrupa proyectos; después puedes juntarlos en un libro.' }));
    if (cur && RT.canWrite) {
      bar.append(h('span', { class: 'spacer' }));
      const inF = list.filter(x => x.doc.data.folder === cur);
      if (inF.length >= 2) bar.append(btn([icon('book'), 'Juntar en un libro'], () => this.joinDialog(inF.map(x => x.doc.id)), 'small'));
      bar.append(ibtn('more', 'Opciones de la carpeta', (e) => UI.menu(e.currentTarget, [{ label: 'Renombrar carpeta', onClick: () => this.renameFolder(cur) }, { label: 'Quitar carpeta', danger: true, onClick: () => this.deleteFolder(cur) }])));
    }
    return { bar: bar, cur: cur };
  },

  /* ---------- copiar capítulos entre proyectos ---------- */
  strip(data) { const o = {}; Object.keys(data || {}).forEach(k => { if (k[0] !== '_') o[k] = data[k]; }); return o; },
  async readChapters(pid) {
    Store.flushAll && Store.flushAll();
    const f = App.findProj(pid); if (!f) return [];
    const base = App.spacePath(f.space) + '/' + pid;
    const out = [];
    for (const c of (f.doc.data.chapters || [])) {
      let data = null;
      if (App.pid === pid && App.ch(c.id) && App.ch(c.id).data) data = clone(App.ch(c.id).data);
      else { try { const s = await RT.db.doc(base + '/chapters/' + c.id).get(); data = s.exists === false ? null : (typeof s.data === 'function' ? s.data() : s.data); } catch (e) { data = null; } }
      out.push({ meta: c, data: this.strip(data || { paras: [] }) });
    }
    return out;
  },
  async writeChapter(space, pid, cid, data) {
    const d = this.strip(data); delete d.report; delete d.dismiss;
    d.paras = d.paras && d.paras.length ? d.paras : [{ id: uid('p'), segs: [] }];
    d._v = uid('v');
    await RT.db.doc(App.spacePath(space) + '/' + pid + '/chapters/' + cid).set(d);
  },
  /* Inserta entradas de capítulos en otro proyecto, antes de sus secciones finales. */
  appendEntries(x, entries) {
    let i = x.chapters.length; while (i > 0 && x.chapters[i - 1].role && SPECIAL[x.chapters[i - 1].role] && !SPECIAL[x.chapters[i - 1].role].front) i--;
    x.chapters.splice(i, 0, ...entries);
  },
  projectPicker(exclude, onPick, title, allowNew) {
    const list = App.allProjects().filter(x => !x.doc.data.trashed && x.doc.id !== exclude);
    const sel = h('select', { class: 'sel', 'aria-label': 'Proyecto' });
    if (allowNew) sel.append(h('option', { value: '__new', text: 'Un proyecto nuevo…' }));
    list.forEach(x => sel.append(h('option', { value: x.doc.id, text: x.doc.data.title + (x.doc.data.folder ? ' · ' + x.doc.data.folder : '') })));
    UI.modal({ title: title, body: h('label', { class: 'field' }, h('span', { text: 'Proyecto' }), sel), buttons: [{ label: 'Cancelar' }, { label: 'Listo', cls: 'primary', onClick: () => { onPick(sel.value); } }] });
  },
  chapterTo(cid, move) {
    const title = (move ? 'Mover' : 'Copiar') + ' «' + (App.chTitle(cid) || App.unit()) + '» a…';
    this.projectPicker(App.pid, async (target) => {
      let tpid = target;
      if (target === '__new') {
        const t = await UI.prompt('Proyecto nuevo', 'Título', App.chTitle(cid) || 'Sin título'); if (t == null) return;
        tpid = await this.createEmpty(t, App.P().kind, App.findProj(App.pid).space);
      }
      const f = App.findProj(tpid); if (!f) return;
      const d = App.ch(cid); if (!d || !d.data) return;
      Store.flushAll && Store.flushAll();

    const cat = IDEA_CATS[x.cat] || IDEA_CATS.otra;
    const ch = x.cid ? App.chapterList().find(c => c.id === x.cid) : null;
    const el = h('article', { class: 'idea' + (x.pin ? ' pin' : '') + (x.done ? ' done' : '') + (x.img && !x.text ? ' only-img' : ''), dataset: { id: x.id } });
    if (x.img) el.append(h('img', { src: x.img, alt: x.kind === 'garabato' ? 'Garabato' : 'Imagen', loading: 'lazy', onclick: () => this.zoomImg(x.img) }));
    if (x.text) el.append(h('p', { class: 'idea-t', text: x.text }));
    const meta = h('div', { class: 'idea-m' });
    meta.append(h('button', { type: 'button', class: 'idea-cat', title: (x.catAuto ? 'Clasificada sola' : 'Clasificada por ti') + '. Toca para cambiar.', onclick: (e) => RT.canWrite && this.catMenu(e.currentTarget, x) }, h('span', { text: cat.g }), cat.l + (x.catAuto ? '' : ' ✓')));
    this.mentions(x.text).slice(0, 3).forEach(n => meta.append(h('span', { class: 'idea-who', text: n })));
    meta.append(h('button', { type: 'button', class: 'idea-ch', title: 'Dónde va', onclick: (e) => RT.canWrite && this.chMenu(e.currentTarget, x) }, ch ? '→ ' + (ch.title || Pages.label(ch)) : 'Sin lugar'));
    el.append(meta);
    const sg = !x.cid && !x.done && RT.canWrite ? this.suggest(x) : null;
    if (sg) el.append(h('div', { class: 'idea-sug' },
      h('span', null, '¿Va en ', h('b', { text: sg.c.title || Pages.label(sg.c) }), '? ', h('span', { class: 'why', text: sg.why })),
      h('button', { type: 'button', class: 'yes', onclick: () => this.update(x.id, z => { z.cid = sg.c.id; }) }, 'Sí'),
      h('button', { type: 'button', class: 'no', title: 'No sugerir este lugar', onclick: () => this.update(x.id, z => { z.noSug = (z.noSug || []).concat(sg.c.id); delete z.aiSug; }) }, '×')));
    if (RT.canWrite) el.append(h('div', { class: 'idea-a' },
      h('button', { type: 'button', class: 'ia', title: x.pin ? 'Desfijar' : 'Fijar arriba', 'aria-pressed': x.pin ? 'true' : 'false', onclick: () => this.update(x.id, z => { z.pin = !z.pin; }) }, '★'),
      h('button', { type: 'button', class: 'ia', title: x.done ? 'Volver a pendientes' : 'Marcar como usada', onclick: () => this.update(x.id, z => { z.done = !z.done; }) }, x.done ? '↺' : '✓'),
      ibtn('more', 'Opciones', (e) => this.menu(e.currentTarget, x), { class: 'ibtn ia' })));
    el.append(h('time', { class: 'idea-d', text: relTime(x.at) }));
    return el;
  },
  /* ---------- dónde podría ir (sin IA): nombres de la biblia y palabras en común ---------- */
  prepSuggest() {
    const words = (t) => (fold(t).match(/[a-zñ]{5,}/g) || []).filter(w => !STOP.has(w)).map(w => w.slice(0, 6));
    this.chStats = App.chapterList().filter(c => c.role !== 'parte').map(c => {
      const d = App.ch(c.id); const text = d && d.data ? d.data.paras.map(parText).join('\n') : '';
      const tf = new Map(); words(text).forEach(w => tf.set(w, (tf.get(w) || 0) + 1));
      return { c: c, text: text, tf: tf, n: Math.max(1, countWords(text)) };
    }).filter(s => s.n > 20);
    const df = new Map(); this.chStats.forEach(s => s.tf.forEach((v, w) => df.set(w, (df.get(w) || 0) + 1)));
    this.df = df;
  },
  suggest(x) {
    if (x.aiSug && x.aiSug.cid && !(x.noSug || []).includes(x.aiSug.cid)) { const c = App.chapterList().find(z => z.id === x.aiSug.cid); if (c) return { c: c, why: x.aiSug.why || 'sugerencia de la IA' }; }
    if (!this.chStats || this.chStats.length < 2 || !x.text) return null;
    const N = this.chStats.length;
    const ws = Array.from(new Set((fold(x.text).match(/[a-zñ]{5,}/g) || []).filter(w => !STOP.has(w)).map(w => w.slice(0, 6))));
    const names = this.mentions(x.text);
    let best = null, second = 0;
    this.chStats.forEach(s => {
      if ((x.noSug || []).includes(s.c.id)) return;
      let score = 0; const shared = []; const who = [];
      names.forEach(nm => { const k = (s.text.match(new RegExp('(?<![\\p{L}])' + escRe(nm) + '(?![\\p{L}])', 'giu')) || []).length; if (k) { score += 2 + Math.min(4, k) * 0.6; who.push(nm); } });
      ws.forEach(w => { const f = s.tf.get(w); if (f) { const idf = Math.log(1 + N / (this.df.get(w) || 1)); score += idf * Math.min(3, f) * 0.9; if (idf > 0.5) shared.push(w); } });
      score = score / Math.sqrt(1 + ws.length / 6);
      if (!best || score > best.score) { if (best) second = Math.max(second, best.score); best = { c: s.c, score: score, who: who, shared: shared }; }
      else second = Math.max(second, score);
    });
    if (!best || best.score < 1.2 || best.score < second * 1.3) return null;
    const why = best.who.length ? '(ahí aparece ' + best.who.slice(0, 2).join(' y ') + ')' : best.shared.length ? '(comparte «' + best.shared.slice(0, 3).map(st => { const m = (x.text.match(/[\p{L}]{5,}/gu) || []).find(w => fold(w).startsWith(st)); return m ? m.toLowerCase() : st; }).join('», «') + '»)' : '';
    return { c: best.c, why: why };
  },
  /* ---------- tablero: columnas por capítulo, se arrastra para ubicar ---------- */
  board(shown) {
    const cols = [{ id: null, label: 'Sin lugar' }].concat(App.chapterList().map(c => ({ id: c.id, label: c.title || Pages.label(c), part: c.role === 'parte' })));
    const wrap = h('div', { class: 'idea-board' });
    cols.forEach(col => {
      const items = shown.filter(x => (x.cid || null) === col.id);
      if (col.part && !items.length) { wrap.append(h('div', { class: 'ib-part', text: col.label })); return; }
      const box = h('section', { class: 'ib-col' + (col.id ? '' : ' none'), dataset: { cid: col.id || '' } }, h('h4', null, h('span', { text: col.label }), h('b', { text: String(items.length) })));
      const list = h('div', { class: 'ib-list' });
      items.forEach(x => {
        const sg = !x.cid ? this.suggest(x) : null;
        const it = h('div', { class: 'ib-it', draggable: RT.canWrite ? 'true' : 'false', dataset: { id: x.id }, title: 'Arrastra a otro capítulo' },
          x.img ? h('img', { src: x.img, alt: '' }) : null,
          x.text ? h('p', { text: x.text.length > 140 ? x.text.slice(0, 140) + '…' : x.text }) : null,
          h('span', { class: 'ib-cat', text: (IDEA_CATS[x.cat] || IDEA_CATS.otra).g + ' ' + (IDEA_CATS[x.cat] || IDEA_CATS.otra).l }),
          sg ? h('button', { type: 'button', class: 'ib-sug', title: 'Llevar ahí ' + sg.why, onclick: () => this.update(x.id, z => { z.cid = sg.c.id; }) }, '→ ' + (sg.c.title || Pages.label(sg.c)) + '?') : null);
        it.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/idea', x.id); it.classList.add('drag'); });
        it.addEventListener('dragend', () => it.classList.remove('drag'));
        it.addEventListener('click', (e) => { if (e.target.closest('.ib-sug') || !RT.canWrite) return; this.chMenu(it, x); });
        list.append(it);
      });
      if (!items.length) list.append(h('div', { class: 'ib-empty', text: col.id ? 'Arrastra aquí' : 'Todo ubicado' }));
      box.append(list);
      box.addEventListener('dragover', (e) => { if (Array.from(e.dataTransfer.types).includes('text/idea')) { e.preventDefault(); box.classList.add('over'); } });
      box.addEventListener('dragleave', () => box.classList.remove('over'));
      box.addEventListener('drop', (e) => { e.preventDefault(); box.classList.remove('over'); const id = e.dataTransfer.getData('text/idea'); if (id) this.update(id, z => { z.cid = col.id; }); });
      wrap.append(box);
    });
    return wrap;
  },
  /* ---------- botón flotante (en el editor y demás vistas del proyecto) ---------- */
  fab() {
    let b = $('#idea-fab');
    const show = App.view === 'project' && RT.canWrite && !App.focus;
    if (!show) { if (b) b.remove(); return; }
    const n = this.coll ? this.list().filter(x => !x.done && !x.cid).length : 0;
    if (!b) {
      b = h('div', { id: 'idea-fab', class: 'idea-fab' },
        h('button', { type: 'button', class: 'fab-main', title: 'Anotar una idea (' + keys('alt', 'N') + ')', onclick: () => this.quick() }, icon('idea'), h('span', { class: 'lbl', text: 'Idea' })),
        h('button', { type: 'button', class: 'fab-all', title: 'Ver todas las ideas', onclick: () => App.go('p-' + App.pid + '-ideas') }, h('b')));
      document.body.append(b);
    }
    const all = b.querySelector('.fab-all'); all.hidden = !n || App.tab === 'ideas';
    all.querySelector('b').textContent = n > 99 ? '99+' : String(n);
    all.title = plural(n, 'idea sin lugar', 'ideas sin lugar') + ' · ver todas';
  },
  catMenu(a, x) { UI.menu(a, Object.keys(IDEA_CATS).map(k => ({ label: IDEA_CATS[k].g + '  ' + IDEA_CATS[k].l, checked: x.cat === k, onClick: () => this.update(x.id, z => { z.cat = k; z.catAuto = false; }) }))); },
  chMenu(a, x) {
    UI.menu(a, [{ label: 'Sin lugar todavía', checked: !x.cid, onClick: () => this.update(x.id, z => { z.cid = null; }) }, { sep: true }]
      .concat(App.chapterList().map(c => ({ label: c.title || Pages.label(c), checked: x.cid === c.id, onClick: () => this.update(x.id, z => { z.cid = c.id; }) }))));
  },
  menu(a, x) {
    const items = [
      { label: 'Editar texto', onClick: async () => { const t = await UI.prompt('Editar idea', 'Texto', x.text || ''); if (t != null) this.update(x.id, z => { z.text = t.trim(); if (z.catAuto) z.cat = this.classify(z.text, !!z.img); }); } },
      x.img && x.kind === 'garabato' ? { label: 'Seguir el garabato', onClick: () => this.sketch((u) => this.update(x.id, z => { z.img = u; }), x.img) } : null,
      x.cid ? { label: 'Abrir el ' + App.unit().toLowerCase(), onClick: () => App.go(App.chHash(x.cid)) } : null,
      (x.cat === 'personaje' || x.cat === 'lugar' || x.cat === 'mundo') && x.text ? { label: 'Crear ficha en la biblia', onClick: () => this.toBible(x) } : null,
      x.cat === 'investigar' || x.cat === 'trama' ? { label: 'Llevar a cabos sueltos', onClick: () => this.toThread(x) } : null,
      { sep: true },
      { label: 'Borrar', danger: true, onClick: () => this.remove(x.id) }
    ];
    UI.menu(a, items);
  },
  toBible(x) {
    const want = x.cat === 'personaje' ? /personaj/i : x.cat === 'lugar' ? /lugar|locaci/i : /mundo|regla/i;
    const P = App.P();
    // si la idea nombra a alguien que ya tiene ficha, se agrega a sus notas
    let target = null;
    ((P.bible && P.bible.sections) || []).forEach(s => (s.items || []).forEach(it => { if (!target && it.title && new RegExp('(?<![\\p{L}])' + escRe(it.title.trim()) + '(?![\\p{L}])', 'iu').test(x.text)) target = { sid: s.id, iid: it.id, title: it.title }; }));
    if (target) {
      App.proj().update(p => { const s = p.bible.sections.find(z => z.id === target.sid); const it = s && s.items.find(z => z.id === target.iid); if (it) it.body = ((it.body || '').trim() ? it.body.trim() + '\n\n' : '') + x.text; }, { now: true });
      App.toast('Agregada a las notas de la ficha de «' + target.title + '».', { action: { label: 'Ver', fn: () => App.go('p-' + App.pid + '-biblia') } });
      return;
    }
    const first = (x.text.split(/[.:\n,—]/)[0] || '').trim().split(/\s+/).slice(0, 5).join(' ');
    App.proj().update(p => {
      p.bible = p.bible || { sections: [] };
      let s = p.bible.sections.find(z => want.test(z.label) || (x.cat === 'personaje' && z.graph));
      if (!s) { s = { id: uid('s'), label: x.cat === 'personaje' ? 'Personajes' : x.cat === 'lugar' ? 'Lugares' : 'Mundo y reglas', fields: [], graph: x.cat === 'personaje', items: [] }; p.bible.sections.push(s); }
      s.items = s.items || []; s.items.push({ id: uid('i'), title: first, fields: {}, body: x.text });
    }, { now: true });
    App.toast('Ficha creada en la biblia: «' + first + '». Revisa el título.', { action: { label: 'Ver', fn: () => App.go('p-' + App.pid + '-biblia') } });
  },
  toThread(x) {
    App.proj().update(p => { p.threads = p.threads || []; p.threads.push({ id: uid('t'), title: (x.text || '').split('\n')[0].slice(0, 90), body: x.text, status: 'open', cid: x.cid || undefined, at: Date.now() }); }, { now: true });
    App.toast('Quedó en «Cabos sueltos» de la biblia.');
  },
  zoomImg(src) { UI.modal({ title: 'Imagen', body: h('img', { src: src, alt: '', class: 'idea-zoom' }), buttons: [{ label: 'Cerrar', cls: 'primary' }] }); },
  /* Ordenar con IA: solo asigna categorías; no agrega ni cambia el texto. */
  async aiSort() {
    if (!Review.ok()) return;
    const items = this.list().filter(x => x.text && !x.done && (x.catAuto || !x.cid)).slice(0, 60);
    if (!items.length) { App.toast('No hay ideas pendientes de ordenar.'); return; }
    App.toast('Ordenando ' + plural(items.length, 'idea') + '…', { id: 'ais', ms: 10000 });
    const chs = App.chapterList().filter(c => c.role !== 'parte').map((c, i) => { const d = App.ch(c.id); const t = d && d.data ? d.data.paras.map(parText).join(' ') : ''; return { i: i + 1, c: c, t: t.replace(/\s+/g, ' ').slice(0, 700) }; });
    const prompt = 'Ordena las ideas sueltas de un proyecto de escritura. Para cada idea: (1) una categoría entre ' + Object.keys(IDEA_CATS).join(', ') + '; (2) el número del capítulo donde calza mejor según lo que ya está escrito, o 0 si no se puede saber; (3) una razón breve (máximo 12 palabras) basada en el texto existente.\n' +
      'No inventes trama, escenas ni contenido; no reescribas las ideas. Solo clasifica y ubica.\n' +
      'Responde solo JSON: [{"n":número de idea,"cat":"categoría","cap":número de capítulo,"por":"razón"}].\n\nCAPÍTULOS (inicio de cada uno):\n' + chs.map(x => x.i + '. ' + (x.c.title || Pages.label(x.c)) + ': ' + (x.t || '(vacío)')).join('\n') +
      '\n\nIDEAS:\n' + items.map((x, i) => (i + 1) + '. ' + x.text.replace(/\s+/g, ' ').slice(0, 400)).join('\n');
    try {
      const r = await RT.sample(prompt, { modelTier: 'quick' });
      const arr = typeof parseJsonLoose === 'function' ? parseJsonLoose(r.text) : JSON.parse(r.text);
      let nc = 0, ns = 0;
      (Array.isArray(arr) ? arr : []).forEach(o => {
        const x = items[(+o.n) - 1]; if (!x) return;
        const ch = chs[(+o.cap) - 1];
        this.update(x.id, z => {
          if (z.catAuto && IDEA_CATS[o.cat] && o.cat !== z.cat) { z.cat = o.cat; nc++; }
          if (!z.cid && ch && !(z.noSug || []).includes(ch.c.id)) { z.aiSug = { cid: ch.c.id, why: o.por ? '(' + String(o.por).slice(0, 90) + ')' : '' }; ns++; }
        });
      });
      App.toast((nc ? plural(nc, 'idea reclasificada', 'ideas reclasificadas') + '. ' : '') + (ns ? plural(ns, 'sugerencia', 'sugerencias') + ' de lugar: confírmalas en cada tarjeta.' : 'Sin sugerencias de lugar.'), { id: 'ais', ms: 6000 });
    } catch (e) { App.toast('No se pudo ordenar ahora. Intenta de nuevo.', { id: 'ais' }); }
  },
  /* Indicador en el editor: ideas asignadas a este capítulo. */
  chapterBadge() {
    const eb = $('#ch-eyebrow'); if (!eb || !App.cid) return;
    const n = this.list().filter(x => x.cid === App.cid && !x.done).length;
    let b = $('#idea-badge');
    if (!n) { if (b) b.remove(); return; }
    if (!b) { b = h('button', { type: 'button', id: 'idea-badge', class: 'idea-badge', onclick: () => { this.chFilter = App.cid; App.go('p-' + App.pid + '-ideas'); } }); eb.after(b); }
    b.textContent = '✦ ' + plural(n, 'idea', 'ideas') + ' para este ' + App.unit().toLowerCase();
  }
};
window.Ideas = Ideas;
document.addEventListener('keydown', (e) => {
  if (!window.App || App.view !== 'project' || !RT.canWrite) return;
  if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.code === 'KeyN') { e.preventDefault(); Ideas.quick(); }
});

/* utilidades visibles para depurar desde la consola */
window.MDE = { allMarks: allMarks, findMark: findMark, parText: parText, RT: RT, Store: Store };

App.init();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var w = reg.installing; if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller && window.UI) {
            UI.toast('Hay una versión nueva de la app.', { action: { label: 'Actualizar', fn: function () { w.postMessage('skip'); } }, ms: 20000 });
          }
        });
      });
    }).catch(function () {});
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (reloaded) return; reloaded = true; if (window.Store) Store.flushAll(); setTimeout(function () { location.reload(); }, 300); });
  });
}
</script>
