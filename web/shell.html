<meta name="theme-color" content="#0E0C0B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/*CSS*/
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="selbar" class="selbar" hidden role="toolbar" aria-label="Marcar la selección"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem;font-family:system-ui">Máquina de escribir necesita JavaScript.</p></noscript>
<script>window.MDE_WEB = true; window.MDE_VERSION = '/*VERSION*/';</script>
<script>
(function () {
'use strict';
/*JS*/
App.init();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var w = reg.installing; if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller && window.UI) {
            UI.toast('Hay una versión nueva de la app.', { action: { label: 'Actualizar', fn: function () { w.postMessage('skip'); } }, ms: 20000 });
          }
        });
      });
    }).catch(function () {});
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (reloaded) return; reloaded = true; if (window.Store) Store.flushAll(); setTimeout(function () { location.reload(); }, 300); });
  });
}
</script>
</body>
</html>
